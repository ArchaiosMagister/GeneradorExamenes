name: Verificar barra vista previa iPad (temporal)
on:
  push:
    branches: [fix/ipad-preview-actions-compact-20261117]
    paths: ['.github/workflows/temporary-verify-ipad-actions.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML autónomo desde fuentes
        run: npm run offline:build
      - name: Sincronizar HTML autónomo en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync offline HTML with compact iPad preview actions"
            git push
          fi
      - name: Instalar Chromium para pruebas visuales
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Probar tamaños iPad y navegación en web y HTML autónomo
        run: node scripts/test-compact-exam-sidebar.cjs

# Comprobación revisada: cinco columnas y ancho adaptable.

