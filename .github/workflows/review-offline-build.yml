name: Preparar HTML autónomo de la rama de revisión (sin despliegue)
on:
  push:
    branches:
      - feat/export-workspace-pdf-20261115
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar HTML autocontenido
        run: node scripts/build-offline.mjs
      - name: Comprobar la sintaxis del empaquetado antes de actualizar la rama
        run: node scripts/test-offline.mjs
      - name: Sincronizar únicamente en rama de revisión
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: reparar bundle PDF local de offline.html"
            git push origin HEAD:feat/export-workspace-pdf-20261115
          fi
