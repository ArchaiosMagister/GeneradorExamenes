name: Preparar HTML autónomo de la rama de revisión (sin despliegue)
on:
  push:
    branches:
      - feat/export-workspace-pdf-20261115
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar HTML autónomo usando sólo recursos locales
        run: node scripts/build-offline.mjs
      - name: Validar que la biblioteca PDF esté embebida
        run: |
          test -s offline.html
          grep -q 'ExaminaPdfExport' offline.html
          grep -q 'examinaWorkspaceStyles' offline.html
      - name: Sincronizar archivo sólo en la rama de trabajo
        run: |
          git add offline.html
          if git diff --cached --quiet; then
            echo "El HTML autónomo ya estaba sincronizado"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar offline.html para la revisión de interfaz"
            git push origin HEAD:feat/export-workspace-pdf-20261115
          fi
