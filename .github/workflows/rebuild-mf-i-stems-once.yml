name: Regenerar HTML autónomo para la auditoría -i (temporal)
on:
  push:
    branches:
      - fix/latin-mf-i-stems-civis-navis-urbs-20261122
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/latin-mf-i-stems-civis-navis-urbs-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir únicamente offline.html y eliminar este workflow temporal
        run: |
          set -euo pipefail
          npm run offline:build
          git diff --quiet -- offline.html && { echo 'No se regeneró el HTML esperado'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/rebuild-mf-i-stems-once.yml
          git commit -m 'build: sincronizar HTML autónomo de civis, navis y urbs'
          git push origin HEAD:fix/latin-mf-i-stems-civis-navis-urbs-20261122
