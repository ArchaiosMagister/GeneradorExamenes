name: Reconstruir HTML autónomo en rama de auditoría latina
on:
  push:
    branches:
      - fix/latin-third-declension-semantic-audit-20261120
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latin-offline-audit-20261120
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'ArchaiosMagister/GeneradorExamenes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir el HTML autónomo
        run: npm run offline:build
      - name: Confirmar únicamente el artefacto offline en la rama
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline.html
            git commit -m "build: regenerate offline HTML after verified Latin repairs"
            git push origin HEAD:fix/latin-third-declension-semantic-audit-20261120
          fi
