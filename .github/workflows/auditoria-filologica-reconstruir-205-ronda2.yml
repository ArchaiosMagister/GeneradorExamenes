name: Reconstruir filología PR205 ronda 2 (sin publicar)
on:
  push:
    branches: [fix/auditoria-griego-acentos-espiritus-20261121]
    paths: ['.github/workflows/auditoria-filologica-reconstruir-205-ronda2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconstruir-filologia-pr205-ronda2
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Reconstruir y validar origen academico y HTML autonomo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-griego-acentos-espiritus-20261121
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar indice reproducible
        run: node scripts/build-lemma-index.mjs
      - name: Regenerar version autonoma
        run: npm run offline:build
      - name: Validacion filologica en las dos versiones
        run: |
          node scripts/test-filologia-latin4-quantity-clusters-20261121.cjs
          node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Solo se modifican artefactos academicos
        run: |
          git diff --name-only > /tmp/diff-files
          if grep -Ev '^(offline\.html|data/lemmas/teacher-forms\.json)$' /tmp/diff-files; then
            echo 'Cambios fuera de los dos artefactos'; exit 1
          fi
      - name: Guardar cambios comprobados en rama de PR sin publicar
        run: |
          git add -- offline.html data/lemmas/teacher-forms.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: reconstruir indice y offline tras 17 cantidades latinas'
            git push origin HEAD:fix/auditoria-griego-acentos-espiritus-20261121
          fi
