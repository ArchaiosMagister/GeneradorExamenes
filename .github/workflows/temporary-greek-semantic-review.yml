name: Temporary Greek complete curriculum and standalone validation
on:
  push:
    branches: [fix/greek-declina-table-gap-20261118]
permissions:
  contents: write
jobs:
  greek:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild offline
        run: npm run offline:build
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Semantic regeneration and glossary tests
        run: |
          node scripts/test-greek-choice-semantics-and-isolation.cjs
          node scripts/test-greek-choice-number-glossary.cjs
          node scripts/test-greek-choice-bullets-spacing.cjs
          node scripts/test-greek-choice-groups.cjs
          node scripts/test-greek-complete-ud5-regressions.cjs
      - name: Publish synchronized offline HTML to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/greek-declina-table-gap-20261118
          git reset --hard FETCH_HEAD
          npm run offline:build
          git add offline.html
          if git diff --cached --quiet; then
            echo "Standalone already synchronized"
            exit 0
          fi
          git commit -m "build: synchronize Greek complete semantic and verb changes"
          git push origin HEAD:fix/greek-declina-table-gap-20261118
