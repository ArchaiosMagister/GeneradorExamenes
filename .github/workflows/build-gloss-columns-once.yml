name: Reconstruir HTML autónomo glosario Word (temporal)
on:
  push:
    branches: ['fix/word-real-two-columns-gloss-20261116']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run offline:build
      - name: Guardar HTML autónomo
        run: |
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sincronizar glosario Word de dos columnas en autónomo'
          git push origin "HEAD:fix/word-real-two-columns-gloss-20261116"
