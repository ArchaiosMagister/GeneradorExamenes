name: Sincronizar HTML autónomo de la fase V (solo rama de trabajo)
on:
  push:
    branches:
      - feat/fase-v-pestanas-movil
    paths:
      - index.html
      - scripts/test-phase-five.cjs
      - .github/workflows/phase-five-offline-sync.yml

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'ArchaiosMagister/GeneradorExamenes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fase-v-pestanas-movil
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir sin publicar
        run: npm run offline:build
      - name: Validar el archivo y guardar el resultado en esta rama
        shell: bash
        run: |
          set -euo pipefail
          test -s offline.html
          git add -- offline.html
          if git diff --cached --quiet; then
            echo "Versión autónoma ya sincronizada"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fase V: reconstruir offline.html con los ajustes adaptables'
            git push origin HEAD:feat/fase-v-pestanas-movil
          fi
