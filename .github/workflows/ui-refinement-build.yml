name: Preparar offline para refinamiento visual

on:
  push:
    branches:
      - style/final-ui-refinement-20261120

permissions:
  contents: write

jobs:
  rebuild-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar y verificar distribución local
        run: |
          npm run offline:build
          npm run offline:test
      - name: Conservar offline.html reproducible en la rama
        run: |
          if ! git diff --quiet -- offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline.html
            git commit -m 'build: sincronizar offline.html con el refinamiento de interfaz'
            git push origin HEAD:style/final-ui-refinement-20261120
          fi
