name: Reconstruir fuentes griegas corregidas (temporal, sin publicar)
on:
  push:
    branches:
      - audit/greek1-third-decl-pragma-20261121
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice desde fuente inmutable con correcciones editoriales
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir PWA autónoma
        run: npm run offline:build
      - name: Verificar sustantivos corregidos y demás paradigmas griegos
        run: |
          node scripts/test-greek-adjective-accent-vocative.cjs
          node scripts/test-greek-pragma-third-decl.cjs
          node scripts/test-greek-reviewed-nominal-expansion.cjs
      - name: Guardar solo el índice y la PWA de rama aislada
        run: |
          if ! git diff --quiet -- data/lemmas/teacher-forms.json offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/lemmas/teacher-forms.json offline.html
            git commit -m 'build: regenerar índice académico de ἡγεμών y PWA'
            git push
          fi
