name: Reconstruir copia autónoma para cotejo latino (sin publicar)
on:
  push:
    branches:
      - fix/latin4-o-final-cantidad-20261122
    paths:
      - '.github/workflows/temporary-rebuild-legacy-quantity-20261122.yml'

permissions:
  contents: write

jobs:
  rebuild:
    name: Reconstrucción y limpieza temporal aisladas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener exactamente la rama de auditoría
        uses: actions/checkout@v4
        with:
          ref: fix/latin4-o-final-cantidad-20261122
          fetch-depth: 1
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducir índice académico
        run: |
          node scripts/build-lemma-index.mjs
          git diff --exit-code -- data/lemmas/teacher-forms.json
      - name: Reconstruir copia autónoma
        run: node scripts/build-offline.mjs
      - name: Validar 42 lecturas y consistencia previa al commit
        run: |
          node scripts/test-filologia-latin-legacy-double-quantity-20261122.cjs
          node scripts/test-cuatro-dativos-fuente5.cjs
      - name: Guardar HTML autónomo y retirar el workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm -f .github/workflows/temporary-rebuild-legacy-quantity-20261122.yml
          git diff --cached --stat
          git commit -m 'build: sincronizar offline tras cotejo de cantidades latinas'
          git push origin HEAD:refs/heads/fix/latin4-o-final-cantidad-20261122
