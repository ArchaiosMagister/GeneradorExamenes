name: Rebuild combined offline audit (temporary)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/audit-combined-offline-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/backup-safety-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both changed components
        run: |
          node scripts/test-unified-backup.cjs
      - name: Rebuild portable standalone distribution
        run: npm run offline:build
      - name: Push deterministic offline bundle
        run: |
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(offline): combine backup safeguards and Greek optimizations"
          git push origin HEAD:refs/heads/audit/backup-safety-20261118
