name: Regeneración puntual del HTML autónomo (PR 226)
on:
  push:
    branches: [fix/manual-morphology-enunciation]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'ArchaiosMagister/GeneradorExamenes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar distribución autónoma
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run offline:build
          if git diff --quiet -- offline.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- offline.html
          git commit -m 'Regenerar HTML autónomo para la PR 226'
          git push origin HEAD:refs/heads/fix/manual-morphology-enunciation
