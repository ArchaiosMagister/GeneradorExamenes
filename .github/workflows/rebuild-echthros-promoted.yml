name: Regenerar índice griego tras 10 verificaciones (solo rama, sin desplegar)
on:
  push:
    branches:
      - integracion/fases-ii-iv-20261113
    paths:
      - data/lemmas/cotejo-10-echthros-20261113.json
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar solamente índice y HTML autónomo con fuentes fijadas
        run: |
          set -euo pipefail
          node scripts/build-lemma-index.mjs
          npm run offline:build
          node scripts/test-echthros-ten-collation.cjs
          node scripts/test-revision-559-griego.cjs
          node scripts/test-candidaturas-lote300-griego.cjs
          node scripts/test-candidaturas-lote200.cjs
          node scripts/test-phase-four-import.cjs
          node scripts/test-greek-adjective-decisions.cjs
          node scripts/test-phase-two-persistent-offline.cjs
      - name: Rechazar cambios no solicitados en el extracto nominal griego
        run: |
          set -euo pipefail
          git diff --exit-code -- data/lemmas/greek-nominal-candidates.json
          git status --short
      - name: Persistir índice y offline en la PR sin publicar
        run: |
          set -euo pipefail
          git add data/lemmas/teacher-forms.json offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: diez femeninos contrastados de ἐχθρός en índice y offline"
            git push origin HEAD:integracion/fases-ii-iv-20261113
          fi
