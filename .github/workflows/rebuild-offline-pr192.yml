name: Reconstruir temporalmente HTML autónomo PR 192
on:
  push:
    branches:
      - fix/latin-verb-lexical-integrity-20261120
    paths:
      - '.github/workflows/rebuild-offline-pr192.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código exacto de la rama
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar datos fuente y conjugaciones
        run: |
          node scripts/test-latin-verb-entry-integrity.cjs
          node scripts/test-required-latin-vocabulary.cjs
          node scripts/audit-latin1-rest-183.cjs
          node scripts/test-comprehensive-morph-audit.cjs
      - name: Regenerar HTML con el compilador oficial del repositorio
        run: npm run offline:build
      - name: Comprobar que la regeneración es determinista e íntegra
        run: |
          git diff --check
          cp offline.html /tmp/examina-pr192-offline.html
          npm run offline:build
          cmp offline.html /tmp/examina-pr192-offline.html
          test -s offline.html
          node scripts/test-offline.mjs
          git diff --exit-code -- data/lemmas/teacher-forms.json
      - name: Incorporar exclusivamente el archivo regenerado a la rama
        run: |
          git add -- offline.html
          if git diff --cached --quiet; then
            echo 'offline.html ya estaba sincronizado'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(offline): synchronize PR 192 with corrected Latin lemma sources'
            git push origin HEAD:fix/latin-verb-lexical-integrity-20261120
          fi
