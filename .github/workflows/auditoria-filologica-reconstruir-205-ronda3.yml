name: Reconstruir filología PR205 ronda 3 (sin despliegue)
on:
  push:
    branches: [fix/auditoria-griego-acentos-espiritus-20261121]
    paths: ['.github/workflows/auditoria-filologica-reconstruir-205-ronda3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-griego-acentos-espiritus-20261121
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índice académico y versión autónoma
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
      - name: Probar corpus e índices sincronizados
        run: |
          node scripts/test-filologia-latin4-quantity-clusters-20261121.cjs
          node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Exigir cambios solo en artefactos reconstruidos
        run: |
          git diff --name-only >/tmp/changed-files
          if grep -Ev '^(offline\.html|data/lemmas/teacher-forms\.json)$' /tmp/changed-files; then
            echo 'Archivos inesperados'; exit 1
          fi
      - name: Guardar únicamente en rama PR, sin publicar
        run: |
          git add -- offline.html data/lemmas/teacher-forms.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: sincronizar índice y offline tras diptongos'
            git push origin HEAD:fix/auditoria-griego-acentos-espiritus-20261121
          fi
