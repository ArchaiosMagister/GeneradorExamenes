name: Sincronizar correcciones filológicas PR 203 sin publicación
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/build-lemma-index.mjs'
      - 'scripts/test-greek-onoma-source0-audit-20261121.cjs'
      - 'data/lemmas/latin-editorial-decisions.json'
      - 'scripts/test-latin-ud7-nix-sol-20261121.cjs'
      - 'required-latin-units.js'
      - 'index.html'
      - '.github/workflows/filologia-onoma-sync-203.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: filologia-onoma-203
  cancel-in-progress: false

jobs:
  reconstruir-indice-offline:
    if: >-
      github.event.pull_request.number == 203 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/auditoria-filologica-latin-griego-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir indice desde el banco externo fijado
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir HTML autonomo desde el mismo indice
        run: npm run offline:build
      - name: Probar morfología griega y latina, cuarentena y paridad estricta
        run: |
          node scripts/test-greek-onoma-source0-audit-20261121.cjs
          node scripts/test-latin-ud7-nix-sol-20261121.cjs
          node scripts/test-regular-latin.mjs
          node scripts/test-required-latin-vocabulary.cjs
          node scripts/test-vocabulary.cjs
          node scripts/test-lemma-index.mjs
          node scripts/test-greek-third-decl-gender-five.cjs
          node scripts/test-greek-ud8-lexical-accents.cjs
          node scripts/test-greek-noun-case-attestation-20261121.cjs
      - name: Controlar que solo se han regenerado dos artefactos
        shell: bash
        run: |
          git diff --name-only > /tmp/artifacts-changed.txt
          cat /tmp/artifacts-changed.txt
          test "$(wc -l < /tmp/artifacts-changed.txt)" -eq 2
          grep -Fxq 'data/lemmas/teacher-forms.json' /tmp/artifacts-changed.txt
          grep -Fxq 'offline.html' /tmp/artifacts-changed.txt
      - name: Guardar ambos artefactos en la rama de revision, sin publicacion
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lemmas/teacher-forms.json offline.html
          git commit -m 'build(filologia): sincronizar nix, sol y ὄνομα en índice y HTML autónomo'
          git push origin "HEAD:$TARGET_BRANCH"
