name: Sincronizar offline.html de léxico (temporal)
on:
  push:
    branches: [fix/sincronizacion-campos-lexico-traduccion-20261114]
    paths:
      - index.html
      - .github/workflows/sync-lex-translation-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sincronizacion-campos-lexico-traduccion-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir offline de forma reproducible (sin desplegar)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/sincronizacion-campos-lexico-traduccion-20261114
          git reset --hard origin/fix/sincronizacion-campos-lexico-traduccion-20261114
          npm run offline:build
          git add -- offline.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sincronizar offline.html tras arreglo de inicialización léxica'
            git push origin HEAD:fix/sincronizacion-campos-lexico-traduccion-20261114
          fi
