name: Comprobar versión autónoma

on:
  pull_request:
    paths:
      - 'index.html'
      - 'offline.html'
      - 'offline-lemmas.js'
      - 'data/lemmas/**'
      - 'data/unimorph/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline.html'
      - 'data/unimorph/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir índice bilingüe del vocabulario docente
        run: node scripts/build-lemma-index.mjs
      - name: Regenerar archivo autónomo
        run: npm run offline:build
      - name: Probar lematización latina y griega sin red
        run: node scripts/test-lemma-index.mjs
      - name: Verificar HTML autónomo
        run: npm run offline:test
      - name: Comprobar estructura de exámenes
        run: node scripts/test-exam-models.cjs
      - name: Preparar Chromium para pruebas visuales
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar las vistas previas de todos los modelos
        run: node scripts/test-preview.cjs
      - name: Probar en Chromium el lematizador sin conexión
        run: node scripts/test-lemma-browser.cjs
