name: CI obligatoria

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Índice y distribución reproducibles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir y comparar binariamente
        run: |
          node scripts/build-lemma-index.mjs
          git diff --exit-code -- data/lemmas/teacher-forms.json
          node scripts/build-offline.mjs
          git diff --exit-code -- offline.html
      - name: Empaquetar una sola vez el sitio que se probará
        run: |
          set -euo pipefail
          bash scripts/pack-site.sh _site "$GITHUB_SHA"
          mkdir validated
          tar -C _site -cf validated/site.tar .
          printf '%s\n' "$GITHUB_SHA" > validated/commit.txt
          (cd validated && sha256sum site.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: site-ci-${{ github.sha }}
          path: validated/
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  sources:
    name: Filología, bancos, persistencia y pruebas sin navegador
    needs: reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clasificación curricular UniMorph
        run: python3 -m unittest discover -s tests
      - name: Ejecutar batería sin navegador
        run: node scripts/check-release.cjs sources
      - name: Guardar resultados e inventarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-fuentes-${{ github.run_attempt }}
          path: test-artifacts/
          retention-days: 30

  chromium:
    name: Chromium y exámenes reales (${{ matrix.shard }}/4)
    needs: reproducibility
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node scripts/check-release.cjs chromium ${{ matrix.shard }}
      - name: Guardar resultados y muestras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-chromium-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-artifacts/
          retention-days: 30

  compatibility:
    name: WebKit, perfiles táctiles y PDF multipágina
    needs: reproducibility
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - uses: actions/download-artifact@v4
        with:
          name: site-ci-${{ github.sha }}
          path: validated
      - name: Probar la distribución empaquetada y WebKit
        shell: bash
        run: |
          set -euo pipefail
          (cd validated && sha256sum --strict --check SHA256SUMS)
          mkdir _site
          tar -xf validated/site.tar -C _site
          CI_SITE_DIR="$PWD/_site" node scripts/check-release.cjs compatibility
      - name: Guardar resultados de compatibilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-compatibilidad-${{ github.run_attempt }}
          path: test-artifacts/
          retention-days: 30
