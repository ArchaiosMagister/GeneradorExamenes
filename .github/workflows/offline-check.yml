name: Comprobar versión autónoma

on:
  pull_request:
    paths:
      - 'index.html'
      - 'offline.html'
      - 'offline-lemmas.js'
      - 'data/lemmas/**'
      - 'data/unimorph/**'
      - 'scripts/**'
      - 'pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline.html'
      - 'data/lemmas/**'
      - 'data/unimorph/**'
      - 'scripts/**'
      - 'pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar modelos regulares sin incorporación a los exámenes
        run: node scripts/test-regular-latin.mjs
      - name: Probar nominales griegos con corpus sintético etiquetado
        run: node scripts/test-greek-nominal-import.mjs
      - name: Extraer nominales griegos reales para consulta offline
        run: node scripts/build-greek-nominal-candidates.mjs
      - name: Construir índice bilingüe del vocabulario docente
        run: node scripts/build-lemma-index.mjs
      - name: Regenerar archivo autónomo
        run: npm run offline:build
      - name: Probar lematización latina y griega sin red
        run: node scripts/test-lemma-index.mjs
      - name: Verificar HTML autónomo
        run: npm run offline:test
      - name: Comprobar estructura de exámenes
        run: node scripts/test-exam-models.cjs
      - name: Preparar Chromium para pruebas visuales
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar las vistas previas de todos los modelos
        run: node scripts/test-preview.cjs
      - name: Probar PWA sin red y actualizaciones controladas
        run: npm run pwa:test
      - name: Probar en Chromium el lematizador sin conexión
        run: node scripts/test-lemma-browser.cjs
      - name: Guardar la base offline y el HTML descargable en main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lemmas/teacher-forms.json data/lemmas/greek-nominal-candidates.json offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar lematizador autónomo bilingüe'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
