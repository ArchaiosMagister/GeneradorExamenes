name: Comprobar versión autónoma

on:
  pull_request:
    paths:
      - 'index.html'
      - 'exam-scoring.js'
      - 'unified-backup.js'
      - 'culture-lat4.js'
      - 'lexicon-valenciano.js'
      - 'required-latin-units.js'
      - 'vocabulary-generator.js'
      - 'vocabulary-quality.js'
      - 'offline.html'
      - 'offline-lemmas.js'
      - 'verification-review.js'
      - 'greek-review.js'
      - 'eulexis-local.js'
      - 'data/lemmas/**'
      - 'data/unimorph/**'
      - 'data/fonetica/**'
      - 'data/fonetica/**'
      - 'scripts/**'
      - 'pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'exam-scoring.js'
      - 'unified-backup.js'
      - 'culture-lat4.js'
      - 'vocabulary-generator.js'
      - 'offline.html'
      - 'data/lemmas/**'
      - 'data/unimorph/**'
      - 'scripts/**'
      - 'pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - '.github/workflows/offline-check.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar prefijos y evolución fonética por UD de Latín 4.º
        run: node scripts/test-lat4-lexico.cjs
      - name: Validar preguntas docentes de cultura LAT4
        run: node scripts/test-cultura-lat4.cjs
      - name: Probar modelos regulares sin incorporación a los exámenes
        run: node scripts/test-regular-latin.mjs
      - name: Verificar evidencia persistente y conjugación mixta de Latín I
        run: node scripts/test-latin-verb-evidence.cjs
      - name: Cotejar paradigmas individuales verificados con la fuente persistente
        run: node scripts/test-verified-verb-overrides.cjs
      - name: Garantizar coherencia de la evidencia en web y PWA guardada
        run: node scripts/test-phase-two-persistent-offline.cjs
      - name: Registrar incidencias de verbos irregulares y deponentes sin certificar paradigmas
        run: node scripts/audit-verbs-evidence.cjs
      - name: Auditar cobertura de tiempos y voces por lema individual
        run: node scripts/audit-verb-coverage.cjs
      - name: Guardar lagunas filológicas por lema para decisión docente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-ii-cobertura-verbal-por-lema
          path: test-artifacts/fase-ii-cobertura-verbal-por-lema.json
          if-no-files-found: ignore
      - name: Conservar cola filológica de verbos para decisiones docentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-ii-irregulares-deponentes
          path: test-artifacts/fase-ii-revision-irregulares-deponentes.json
          if-no-files-found: ignore
      - name: Probar nominales griegos con corpus sintético etiquetado
        run: node scripts/test-greek-nominal-import.mjs
      - name: Validar catálogo griego provisional persistente sin acceso de red
        run: node scripts/test-greek-nominal-persistent.cjs
      - name: Auditar exhaustivamente las candidaturas todavía pendientes sin promoverlas
        run: node scripts/test-comprehensive-morph-audit.cjs
      - name: Comprobar el lote anterior de cien formas ya incorporadas
        run: node scripts/test-candidaturas-lote100.cjs
      - name: Verificar las cien latinas y cien griegas del nuevo lote en el banco y la PWA
        run: node scripts/test-candidaturas-lote200.cjs
      - name: Verificar trescientos análisis griegos, politonía y formas excluidas
        run: node scripts/test-candidaturas-lote300-griego.cjs
      - name: Validar las 31 lecturas documentales y evitar promociones automáticas
        run: node scripts/test-individual-evidence-ledger.cjs
      - name: Aplicar decisiones docentes de tres adjetivos griegos sin verificar las 21 formas
        run: node scripts/test-greek-adjective-decisions.cjs
      - name: Cotejar las diez fichas femeninas de ἐχθρός y sus sincretismos
        run: node scripts/test-echthros-ten-collation.cjs
      - name: Conservar auditoría individualizada de fichas latinas y griegas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-filologica-integral-candidatos
          path: test-artifacts/auditoria-integral-*.json
          if-no-files-found: ignore
      - name: Comprobar índice bilingüe persistente sin reconstrucciones externas
        run: node scripts/test-lemma-index.mjs
      - name: Probar cinco decisiones docentes y variantes sin modificar las claves de examen
        run: node scripts/test-filological-variant-decisions.cjs
      # La ampliación externa se mantiene en la PR experimental hasta
      # resolver la procedencia/licencias de los datos morfológicos.
      - name: Validar banco ampliable de evolución fonética y programa de Latín I
        run: node scripts/test-criterios-foneticos.mjs && node scripts/test-fonetica.mjs && node scripts/test-lat1-fonetica.mjs
      - name: Regenerar archivo autónomo
        run: npm run offline:build
      - name: Exigir que el HTML autónomo regenerado coincida con el archivo del repositorio
        run: git diff --exit-code -- offline.html
      - name: Probar lematización latina y griega sin red
        run: node scripts/test-lemma-index.mjs
      - name: Verificar las 17 decisiones griegas, banco, índice y HTML autónomo
        run: node scripts/test-greek-editorial.cjs
      - name: Auditar incidencias morfológicas y decisiones
        run: node scripts/test-teacher-review.mjs
      - name: Validar evidencia y autorizaciones docentes por forma
        run: node scripts/test-academic-evidence.cjs
      - name: Probar la cola griega y el adaptador de importación Eulexis
        run: node scripts/test-greek-review.mjs
      - name: Probar conversión y extracción Eulexis sin corpus de terceros
        run: node scripts/test-eulexis-local.cjs
      - name: Contrastar extractor Eulexis de forma temporal (no publicar corpus)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/export-eulexis-review.mjs
          node scripts/audit-greek-eulexis-queue.mjs
          node -e "const f=require('./private/eulexis-review.json'); if(f.schema!=='examina-eulexis-review/v1'||!f.rows?.length)process.exit(1); console.log('Extracto Eulexis comprobado:',f.rows.length,'análisis')"
          rm -rf private
      - name: Verificar HTML autónomo
        run: npm run offline:test
      - name: Comprobar estructura de exámenes
        run: node scripts/test-exam-models.cjs
      - name: Preparar Chromium para pruebas visuales
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          # El runner de Ubuntu ya incluye las bibliotecas para Chromium.
          npx playwright install chromium
      - name: Comprobar interfaz de preguntas, UD, alcance del glosario y Eulexis contextual
        run: node scripts/test-auditoria-ui.cjs
      - name: Verificar autorizaciones académicas y bloqueo DOCX en Chromium sin conexión
        run: node scripts/test-academic-evidence-browser.cjs
      - name: Verificar exportación definitiva sin romper descargas de borradores
        run: node scripts/test-final-export-preflight.cjs
      - name: Auditar cada unidad y exportar inventario morfológico grecolatino
        run: node scripts/test-verb-curriculum-browser.cjs
      - name: Conservar matriz curricular para revisión filológica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-ii-inventario-morfologico
          path: test-artifacts/fase-ii-inventario-morfologico.json
          if-no-files-found: ignore
      - name: Validar glosas en castellano y valenciano
        run: node scripts/test-valenciano.cjs
      - name: Auditar cobertura y pendientes del vocabulario por unidad
        run: node scripts/test-vocabulary-quality.cjs
      - name: Probar generador de vocabulario por unidades y Word
        run: npm run vocabulary:test
      - name: Priorizar 50 incidencias reales del lematizador
        run: node scripts/audit-top-50-lemmas.cjs --check
      - name: Revisar otro lote de 100 fichas reales del lematizador
        run: node scripts/audit-next-100-lemmas.cjs --check
      - name: Auditar lematización de oraciones y decisiones guardadas
        run: node scripts/audit-sentence-lemmas.cjs
      - name: Probar lemas ambiguos y formato del glosario de oraciones
        run: node scripts/test-exam-glossary.cjs
      - name: Auditar las 612 formas pendientes aportadas para Latín I
        run: node scripts/audit-latin1-generated.cjs --minimum=429
      - name: Revisar individualmente las 183 pendientes de Latín I
        run: node scripts/audit-latin1-rest-183.cjs
      - name: Verificar contraste de botones de unidades y Limpiar todo
        run: node scripts/test-vg-unit-controls.cjs
      - name: Comprobar 15 correcciones de grafía en el corpus de regresión
        run: node scripts/test-greek-audit-fixture.cjs
      - name: Auditar las 100 formas más frecuentes de Griego I
        run: node scripts/audit-greek-frequent-100.cjs
      - name: Verificar las 15 correcciones persistentes de Griego I
        run: node scripts/test-greek-source-corrections.cjs
      - name: Auditar todas las formas poco frecuentes de Griego I
        run: node scripts/audit-greek-all-units.cjs --require-clean
      - name: Guardar Word de diez frases para comprobación visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulario-diez-frases-word
          path: test-artifacts/vocabulario-latin-10-frases.docx
          if-no-files-found: ignore
      - name: Comprobar menús léxicos, modificación preverbial y Word
        run: node scripts/test-lex-menu-sync.cjs
      - name: Verificar editores bidireccionales en todas las materias, modelos y Word
        run: node scripts/test-bidirectional-editors.cjs
      - name: Comprobar que cada palabra se regenera sin alterar las demás
        run: node scripts/test-single-word-regeneration.cjs
      - name: Fase III - conservar el borrador al regenerar un apartado léxico
        run: node scripts/test-lex-part-regeneration.cjs
      - name: Fase III - regeneración aislada de preguntas latinas y sus soluciones
        run: node scripts/test-question-part-regeneration.cjs
      - name: Fase III - regeneración aislada de preguntas de Griego I
        run: node scripts/test-greek-question-regeneration.cjs
      - name: Fase III - preservar huecos y puntuar una unidad por oración
        run: node scripts/test-sentence-points-and-drafts.cjs
      - name: Fase III - normas fonéticas acumulativas sin regenerar el examen
        run: node scripts/test-phonetic-filter-isolation.cjs
      - name: Fase III - regeneración aislada de morfología latina y griega
        run: node scripts/test-morph-question-isolation.cjs
      - name: Fase III - auditar conjuntamente ediciones, regeneración, borradores y Word
        run: node scripts/test-phase-three-integration.cjs
      - name: Probar las vistas previas de todos los modelos
        run: node scripts/test-preview.cjs
      - name: Guardar Word con puntuaciones de examen para inspección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examen-puntuaciones-latin1-word
          path: test-artifacts/examen-puntuaciones-latin1.docx
          if-no-files-found: ignore
      - name: Validar valenciano en pantalla y Word para los tres cursos
        run: node scripts/test-valenciano-browser.cjs
      - name: Verificar correcciones docentes de Latín I y 4.º, editores y vocabulario exigible
        run: node scripts/test-correcciones-latin.cjs
      - name: Verificar concordancia de tablas y umbrales de unidad
        run: node scripts/test-nominal-agreement.cjs
      - name: Verificar variedad y concordancia de sintagmas nominales grecolatinos
        run: node scripts/test-syntagm-variation.cjs
      - name: Probar PWA sin red y actualizaciones controladas
        run: npm run pwa:test
      - name: Probar en Chromium el lematizador sin conexión
        run: node scripts/test-lemma-browser.cjs
      - name: Probar en Chromium las tarjetas griegas y la importación local
        run: node scripts/test-greek-review-browser.cjs
      - name: Probar instalación y persistencia de Eulexis en Chromium
        run: node scripts/test-eulexis-browser.cjs
