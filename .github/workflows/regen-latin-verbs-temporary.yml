name: Temporal - regenerar autónoma de auditoría verbal
on:
  push:
    branches:
      - fix/latin-verbal-curriculum-20261122
permissions:
  contents: write
jobs:
  build-offline-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin-verbal-curriculum-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar HTML autónomo
        run: node scripts/build-offline.mjs
      - name: Commit controlado y retirar workflow temporal
        run: |
          test -s offline.html
          grep -F -q 'latinSpecialVerbFirstUnit' offline.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regen-latin-verbs-temporary.yml
          git add -f offline.html
          git add -u .github/workflows/regen-latin-verbs-temporary.yml
          git diff --cached --stat
          git commit -m "build: sincronizar offline y retirar regenerador efímero"
          git push origin HEAD:fix/latin-verbal-curriculum-20261122
