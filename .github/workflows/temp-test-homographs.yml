name: Comprobación focalizada temporal de homógrafos

on:
  push:
    branches:
      - audit/latin-homograph-classes-20261115
    paths:
      - '.github/workflows/temp-test-homographs.yml'

permissions:
  contents: read

jobs:
  homographs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Reconstruir HTML autónomo para comprobar consistencia
        run: |
          npm run offline:build
          git diff --exit-code -- offline.html
      - name: Regresión específica de homógrafos, glosario y Word
        run: node scripts/test-exam-glossary.cjs
      - name: Regresión de vocabulario general
        run: node scripts/test-vocabulary.cjs
