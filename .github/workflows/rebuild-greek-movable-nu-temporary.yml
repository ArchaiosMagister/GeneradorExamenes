name: Reconstrucción temporal de ν móvil en PWA (sin publicar)
on:
  push:
    branches:
      - audit/greek-movable-nu-20261121
    paths:
      - scripts/test-greek-movable-nu.cjs

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar PWA desde los fuentes de la rama auditada
        run: |
          node --check scripts/test-greek-movable-nu.cjs
          npm run offline:build
      - name: Contrastar ν móvil, sincretismo y los modelos de examen
        run: |
          node scripts/test-greek-movable-nu.cjs
          node scripts/test-greek-verb-syncretism.cjs
          node scripts/test-exam-models.cjs
          npm run offline:test
      - name: Guardar exclusivamente offline.html en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git diff --cached --stat
          git diff --cached --quiet && { echo 'PWA no reconstruida'; exit 1; }
          git commit -m "build: sincronizar PWA con dos variantes de ν móvil"
          git push origin HEAD:audit/greek-movable-nu-20261121
