name: TEMP reconstruir indice LAT4 y PWA sin desplegar
on:
  push:
    branches:
      - fix/latin4-o-final-cantidad-20261122
    paths:
      - 'data/lemmas/verified-overrides.json'
      - '.github/workflows/temp-latin4-final-o-rebuild-index-20261122.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir el índice desde la fuente aprobada
        run: node scripts/build-lemma-index.mjs
      - name: Exigir índice reproducible sin otras alteraciones
        run: git diff --exit-code -- data/lemmas/teacher-forms.json
      - name: Reconstruir el HTML autónomo
        run: npm run offline:build
      - name: Verificar 7 entradas y paridad web PWA
        run: node scripts/test-filologia-latin4-final-o-20261122.cjs --offline
      - name: Confirmar PWA y retirar workflow temporal
        run: |
          rm .github/workflows/temp-latin4-final-o-rebuild-index-20261122.yml
          git add offline.html .github/workflows/temp-latin4-final-o-rebuild-index-20261122.yml
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(lat4): confirmar índice reproducible y regenerar PWA"
            git push
          fi
