name: Temporal - reconstruir índice y offline tras cotejo de deponentes
on:
  push:
    branches: [fix/latin-deponents-ud7-ud9-editorial-20261122]
permissions:
  contents: write
jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin-deponents-ud7-ud9-editorial-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice docente reproducible con fuentes existentes
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir HTML autónomo
        run: node scripts/build-offline.mjs
      - name: Garantizar evidencia formal y protección curricular
        run: |
          set -euo pipefail
          node scripts/test-latin-verb-evidence.cjs
          node scripts/test-latin-deponents-ud7-ud9-20261122.cjs --source-only
          node scripts/test-lemma-index.mjs
          git diff --check
      - name: Versionar solo los dos artefactos y autoretirar workflow temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regen-latin-deponents-source5-temporary.yml
          git add -f data/lemmas/teacher-forms.json offline.html
          git add -u .github/workflows/regen-latin-deponents-source5-temporary.yml
          git diff --cached --stat
          git commit -m "build(lat): sincronizar 24 casillas deponentes verificadas en índice y offline"
          git push origin HEAD:fix/latin-deponents-ud7-ud9-editorial-20261122
