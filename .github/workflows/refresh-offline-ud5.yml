name: Reconstruir offline tras regresiones UD5

on:
  push:
    branches: [fix/greek-ud5-verb-quotas-indent-20261118]
    paths: ['.github/workflows/refresh-offline-ud5.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/greek-ud5-verb-quotas-indent-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/build-offline.mjs
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sincronizar HTML autónomo con tratamiento de ἦλθον'
            git push origin HEAD:fix/greek-ud5-verb-quotas-indent-20261118
          fi
