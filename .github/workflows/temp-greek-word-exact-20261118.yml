name: Temporary Greek Word model exact indentation and offline
on:
  push:
    branches: [style/gr1-complete-roman-lists-spacing-20261118]
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild autonomous exam
        run: npm run offline:build
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Compare Word model indents, grading, morphology and etymology
        run: |
          node scripts/test-greek-choice-bullets-spacing.cjs
          node scripts/test-greek-complete-ud5-regressions.cjs
      - name: Commit standalone
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: synchronize exact Greek Word model indentation"
            git push origin HEAD:style/gr1-complete-roman-lists-spacing-20261118
          fi
