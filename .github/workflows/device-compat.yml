name: Revisar integración V→VI en Safari y Android (sin despliegue)

on:
  pull_request:
    paths:
      - 'greek-choice-*.js'
      - 'index.html'
      - 'export-workspace.js'
      - 'scripts/test-ui-refinement.cjs'
      - 'scripts/test-latin-semantic-syntagms.cjs'
      - 'scripts/test-greek-academic-expansion.cjs'
      - 'pdf-export.js'
      - 'scripts/test-export-workspace.cjs'
      - 'offline.html'
      - 'exam-scoring.js'
      - 'scripts/test-device-compat.cjs'
      - '.github/workflows/device-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    name: WebKit Safari simulado y Chromium Android
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright sin apt (navegadores incluidos en imagen)
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          node -e "const p=require('playwright'); console.log('Chromium:',p.chromium.executablePath()); console.log('WebKit:',p.webkit.executablePath())"
      - name: Construir distribución autónoma y comprobar reproducibilidad
        run: |
          npm run offline:build
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- offline.html
      - name: Descargar base estable para comparación visual
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Comprobar los siete modelos de examen
        run: |
          node scripts/test-exam-models.cjs
          npm run preview:test
      - name: Auditar Griego I por unidad, paradigmas y regeneración sin repeticiones
        run: node scripts/test-greek-academic-expansion.cjs
      - name: Auditar sintagmas latinos aprobados y prohibición de unus/nullus
        run: node scripts/test-latin-semantic-syntagms.cjs
      - name: Comprobar refinamiento y capturas antes/después
        run: UI_BASELINE_DIR=baseline node scripts/test-ui-refinement.cjs
      - name: Conservar capturas de comparación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-refinement-safari-chromium
          path: test-results/ui-refinement/
          if-no-files-found: ignore
      - name: Verificar navegadores y perfiles táctiles
        run: node scripts/test-device-compat.cjs
      - name: Verificar PDF multipágina en WebKit Safari simulado
        run: PDF_TEST_BROWSER=webkit node scripts/test-export-workspace.cjs
