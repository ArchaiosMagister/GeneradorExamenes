name: Revisar integración V→VI en Safari y Android (sin despliegue)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'offline.html'
      - 'exam-scoring.js'
      - 'scripts/test-device-compat.cjs'
      - '.github/workflows/device-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    name: WebKit Safari simulado y Chromium Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegadores para comprobación sin publicación
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Construir distribución autónoma y comprobar reproducibilidad
        run: |
          npm run offline:build
          git diff --exit-code -- offline.html
      - name: Verificar navegadores y perfiles táctiles
        run: node scripts/test-device-compat.cjs
