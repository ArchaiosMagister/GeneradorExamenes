name: Sincronización temporal optimización 4
on:
  push:
    branches:
      - perf/143-morphology-lookup-index-20261115
    paths:
      - '.github/workflows/temp-optimizer-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y ensamblar
        run: |
          node --check scripts/test-exam-glossary.cjs
          npm run offline:build
          git diff --exit-code -- index.html
      - name: Sincronizar versión autónoma
        run: |
          set -euo pipefail
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(offline): incluir índices morfológicos'
          git push origin HEAD:perf/143-morphology-lookup-index-20261115
