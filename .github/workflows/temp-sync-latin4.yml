name: Sincronización autónoma temporal para abreviaturas latinas

on:
  push:
    branches:
      - fix/latin4-abbreviated-principal-parts-20261115
    paths:
      - '.github/workflows/temp-sync-latin4.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir archivo autónomo y comprobar sintaxis
        run: |
          node --check vocabulary-generator.js
          node --check scripts/test-latin-passive-phrases.cjs
          npm run offline:build
          git diff --exit-code -- index.html
      - name: Guardar HTML regenerado sin desplegar
        run: |
          set -euo pipefail
          git add offline.html
          if git diff --cached --quiet; then
            echo "Sin cambios en offline.html"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(offline): actualizar normalización de abreviaturas latinas'
          git push origin HEAD:fix/latin4-abbreviated-principal-parts-20261115
