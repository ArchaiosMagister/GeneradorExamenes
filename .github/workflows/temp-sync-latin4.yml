name: Sincronizar temporalmente HTML autónomo de Latín 4.º

on:
  push:
    branches:
      - fix/latin4-abbreviated-principal-parts-20261115
    paths:
      - '.github/workflows/temp-sync-latin4.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar rama sin publicar
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y generar PWA autónoma
        run: |
          node --check vocabulary-generator.js
          node --check scripts/test-latin-passive-phrases.cjs
          npm run offline:build
          git diff --exit-code -- index.html
      - name: Sincronizar único HTML derivado
        run: |
          set -euo pipefail
          git add offline.html
          if git diff --cached --quiet; then
            echo "Archivo autónomo ya sincronizado"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(offline): incluir reconocimiento de paradigmas abreviados'
          git push origin HEAD:fix/latin4-abbreviated-principal-parts-20261115
