name: Reconstruir HTML autónomo en rama valenciana (temporal)
on:
  push:
    branches:
      - fix/val-lat4-oracions-traduix-20261115
    paths:
      - 'scripts/test-valencian-imperative.cjs'

permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'ArchaiosMagister/GeneradorExamenes' && github.ref == 'refs/heads/fix/val-lat4-oracions-traduix-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar solo offline.html
        run: |
          set -euo pipefail
          node scripts/build-offline.mjs
          test "$(git diff --name-only)" = 'offline.html'
          git add -- offline.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Sincronizar HTML autónomo con el imperativo valenciano traduïx'
          git push origin HEAD:refs/heads/fix/val-lat4-oracions-traduix-20261115
