name: Auditoría griega UD8 reconstruir índice y PWA (temporal)
on:
  push:
    branches:
      - audit/greek1-ud8-accents-20261121
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índice desde origen inmóvil y correcciones explícitas
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir la versión autónoma
        run: npm run offline:build
      - name: Contrastar revisión UD8 y las tres anteriores
        run: |
          node scripts/test-greek-ud8-lexical-accents.cjs
          node scripts/test-greek-third-decl-gender-five.cjs
          node scripts/test-greek-pragma-third-decl.cjs
          node scripts/test-greek-adjective-accent-vocative.cjs
          node scripts/test-greek-reviewed-nominal-expansion.cjs
      - name: Guardar solo fuentes reconstruidas en esta rama sin publicar
        run: |
          if ! git diff --quiet -- data/lemmas/teacher-forms.json offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/lemmas/teacher-forms.json offline.html
            git commit -m 'build: sincronizar enunciados UD8 e índice académico'
            git push
          fi
