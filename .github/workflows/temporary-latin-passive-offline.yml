name: Construir y verificar lectura verbal offline (temporal, sin publicar)
on:
  push:
    branches: [feat/latin-passive-phrase-choices-20261115]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir HTML autónomo
        run: node scripts/build-offline.mjs
      - name: Verificar archivo autónomo
        run: node scripts/test-offline.mjs
      - name: Preparar navegador
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Probar lecturas verbales en web y offline
        run: node scripts/test-latin-passive-phrases.cjs
      - name: Sincronizar HTML único tras las pruebas
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar interpretación de pasivas en HTML autónomo"
            git push origin HEAD:feat/latin-passive-phrase-choices-20261115
          fi
