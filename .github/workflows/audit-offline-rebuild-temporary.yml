name: Reconstrucción temporal de auditoría
on:
  push:
    branches: [audit/regeneration-isolation-20261127]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/audit/regeneration-isolation-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/regeneration-isolation-20261127
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-offline.mjs
      - run: node scripts/test-regeneration-fail-closed.cjs
      - name: Sincronizar únicamente la distribución autónoma de la rama de auditoría
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- offline.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild standalone HTML for isolated regeneration audit'
            git push origin HEAD:refs/heads/audit/regeneration-isolation-20261127
          fi
