name: Greek two-ending adjective validation and offline build (temporary)
on:
  push:
    branches: [fix/gr1-ud5-two-ending-adjective-forms]
permissions:
  contents: write
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate autonomous HTML
        run: npm run offline:build
      - name: Install browser for verified Greek form selections
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Verify two-ending adjectives and all Greek morphological quotas
        run: |
          node scripts/test-greek-two-ending-adjectives.cjs
          node scripts/test-greek-ud5-quota-indent.cjs
      - name: Commit only reproducibly generated offline HTML
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: synchronize offline Greek adjective selection"
            git push origin HEAD:fix/gr1-ud5-two-ending-adjective-forms
          fi
