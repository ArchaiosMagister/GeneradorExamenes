name: Reconstrucción temporal offline para sintagmas latinos
on:
  push:
    branches:
      - fix/latin-semantic-syntagms-20261120
permissions:
  contents: write
jobs:
  sync-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar y comprobar versión autónoma
        run: |
          npm run offline:build
          npm run offline:test
      - name: Guardar distribución autónoma reproducible
        run: |
          if ! git diff --quiet -- offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline.html
            git commit -m 'build: sincronizar sintagmas latinos en offline.html'
            git push origin HEAD:fix/latin-semantic-syntagms-20261120
          fi
