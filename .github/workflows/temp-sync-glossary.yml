name: Sincronizar HTML autónomo para auditoría puntual

on:
  push:
    branches:
      - audit/glossary-prepositions-independent-20261115
    paths:
      - '.github/workflows/temp-sync-glossary.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de auditoría
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML offline y comprobar diferencia
        run: |
          npm run offline:build
          git diff --stat -- offline.html
          git diff --exit-code -- index.html
      - name: Guardar exclusivamente el HTML regenerado
        run: |
          set -euo pipefail
          git add offline.html
          if git diff --cached --quiet; then
            echo "HTML autónomo ya sincronizado"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(offline): sincronizar glosario de preposiciones'
          git push origin HEAD:audit/glossary-prepositions-independent-20261115
