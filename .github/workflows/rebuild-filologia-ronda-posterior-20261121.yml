name: Reconstruir auditoría filológica posterior a PR205 (sin publicación)
on:
  push:
    branches: [fix/auditoria-filologica-latin-griego-continuacion-20261121]
    paths: ['.github/workflows/rebuild-filologia-ronda-posterior-20261121.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-filologica-latin-griego-continuacion-20261121
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índice desde corpus fijado y HTML autónomo
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
      - name: Verificar cantidades, migraciones, acentuación y copia offline
        run: |
          node scripts/test-filologia-latin4-quantity-clusters-20261121.cjs
          node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Rechazar modificaciones externas a los dos artefactos
        run: |
          git diff --name-only > /tmp/changed-files
          if grep -Ev '^(offline\.html|data/lemmas/teacher-forms\.json)$' /tmp/changed-files; then
            echo 'Cambios inesperados'; exit 1
          fi
      - name: Persistir artefactos verificados en la rama de revisión
        run: |
          git add -- offline.html data/lemmas/teacher-forms.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: sincronizar indice y offline tras auditoria latina y griega'
            git push origin HEAD:fix/auditoria-filologica-latin-griego-continuacion-20261121
          fi
