name: Probar y reconstruir pugnatum est (temporal, sin publicar)
on:
  push:
    branches: [fix/passive-impersonal-pugnatum-20261115]
permissions:
  contents: write
jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar y verificar HTML autónomo
        run: node scripts/build-offline.mjs && node scripts/test-offline.mjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Verificar pugnatum est, perífrasis y elecciones en web/autónoma
        run: node scripts/test-latin-passive-phrases.cjs
      - name: Sincronizar HTML autónomo solo si todo pasa
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar corrección de perífrasis impersonales en HTML offline"
            git push origin HEAD:fix/passive-impersonal-pugnatum-20261115
          fi
