name: Reconstrucción autónoma de sintagmas (temporal)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rebuild-audit-greek-offline.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/greek-syntagm-pool-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run offline:build
      - name: Commit updated offline HTML
        run: |
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(offline): share verified Greek modifier pool"
          git push origin HEAD:refs/heads/perf/greek-syntagm-pool-20261119
