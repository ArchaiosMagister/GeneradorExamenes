name: Reconstruir morfología griega offline (rama aislada)
on:
  push:
    branches:
      - fix/greek-verb-syncretism-20261121
    paths:
      - scripts/test-greek-verb-syncretism.cjs

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis y reconstruir versión autónoma
        run: |
          node --check scripts/test-greek-verb-syncretism.cjs
          npm run offline:build
      - name: Verificar diez paradigmas, doble lectura y paridad offline
        run: |
          node scripts/test-greek-verb-syncretism.cjs
          node scripts/test-greek-academic-expansion.cjs
          node scripts/test-verified-verb-overrides.cjs
      - name: Guardar solo la distribución offline en rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git diff --cached --stat
          git diff --cached --quiet && { echo "No se actualizó offline.html"; exit 1; }
          git commit -m "build: sincronizar PWA con el análisis griego sincrético"
          git push origin HEAD:fix/greek-verb-syncretism-20261121
