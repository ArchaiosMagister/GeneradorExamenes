name: Sincronización temporal de HTML autónomo griego

on:
  push:
    branches:
      - fix/greek-etymology-distinct-roots-20261118

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener la rama
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar HTML autónomo y guardar únicamente si difiere
        shell: bash
        run: |
          set -euo pipefail
          npm run offline:build
          if ! git diff --quiet -- offline.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add offline.html
            git commit -m "build: sincronizar etimología griega en offline.html"
            git push origin "HEAD:refs/heads/fix/greek-etymology-distinct-roots-20261118"
          fi
