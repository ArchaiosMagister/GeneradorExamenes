name: Regenerar artefactos de decisiones griegas (rama de integración)
on:
  push:
    branches:
      - integracion/fases-ii-iv-20261113
    paths:
      - data/lemmas/greek-adjective-decisions.json
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índice con fuentes fijadas y decisiones docentes
        run: |
          set -euo pipefail
          # No regenerar el extracto histórico: la auditoría de 559 formas
          # necesita las mismas identidades y procedencias que se revisaron.
          node scripts/build-lemma-index.mjs
          npm run offline:build
          node scripts/test-greek-adjective-decisions.cjs
          node scripts/test-revision-559-griego.cjs
          node scripts/test-phase-two-persistent-offline.cjs
      - name: Confirmar que se actualizan solo artefactos derivados
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- data/lemmas/greek-nominal-candidates.json
          git add data/lemmas/teacher-forms.json offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar índice y HTML autónomo con tres decisiones griegas"
            git push origin HEAD:integracion/fases-ii-iv-20261113
          fi
