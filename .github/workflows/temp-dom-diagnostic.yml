name: Diagnóstico temporal de HTML del generador
on:
  push:
    branches: [feat/formato-preguntas-cultura-word-20261115]
    paths: [.github/workflows/temp-dom-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Detectar qué está mostrando Chromium
        run: |
          node - <<'NODE'
          const { chromium }=require('playwright');
          const path=require('node:path');
          const {pathToFileURL}=require('node:url');
          (async()=>{
            const b=await chromium.launch({headless:true});
            for(const file of ['index.html','offline.html']){
              const p=await b.newPage();
              p.on('pageerror',e=>console.log('PAGEERROR',file,e.stack));
              p.on('console',m=>console.log('CONSOLE',file,m.type(),m.text().slice(0,200)));
              const url=pathToFileURL(path.resolve(file)).href;
              const response=await p.goto(url,{waitUntil:'load'});
              console.log('DOM',file,await p.evaluate(()=>({
                 href:location.href,ready:document.readyState,title:document.title,
                 hasCourse:!!document.getElementById('course'),
                 hasModel:!!document.getElementById('model'),
                 hasPaper:!!document.getElementById('paper'),
                 bodyLength:document.body?.innerHTML.length,
                 textStart:document.body?.textContent.slice(0,180),
                 bodyStart:document.body?.innerHTML.slice(0,300),
                 htmlLength:document.documentElement?.outerHTML.length
              })));
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
