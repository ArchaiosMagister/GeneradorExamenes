name: Regenerar HTML autónomo y comprobar pestaña activa (temporal)
on:
  push:
    branches: [fix/active-exam-sidebar-contrast-20261117]
    paths:
      - '.github/workflows/temporary-build-active-sidebar.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar versión autónoma desde la fuente
        run: npm run offline:build
      - name: Guardar HTML autónomo actualizado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync offline.html with selected-sidebar contrast"
            git push
          fi
      - name: Instalar Chromium para verificar contraste real
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Probar contraste, estados y navegación en ambas versiones
        run: node scripts/test-compact-exam-sidebar.cjs
