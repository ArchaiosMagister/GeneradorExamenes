# Temporal y exclusivo de PR #169; sin despliegue.
name: PR169 verificar y sincronizar offline
on:
  push:
    branches:
      - feat/exam-review-evolutio-greek-candidates-20261117
permissions:
  contents: write
jobs:
  verify-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regresión de estructura y motor aislado
        run: node scripts/test-exam-models.cjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Comprobar sintagmas aprobados y todas sus casillas
        run: node scripts/test-sintagmas-aprobados-169.cjs
      - name: Regenerar solo HTML autónomo
        run: npm run offline:build
      - name: Sincronizar HTML autónomo en rama (sin publicar)
        run: |
          if git diff --quiet -- offline.html; then
            echo "offline.html ya está sincronizado"
            exit 0
          fi
          git add offline.html
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: sincronizar webapp offline de PR169 tras regresión"
          git push origin "HEAD:${GITHUB_REF_NAME}"
