name: Phase I regression (no deployment)

on:
  pull_request:
    paths:
      - 'greek-choice-*.js'
      - 'index.html'
      - 'pdf-export.js'
      - 'scripts/test-export-workspace.cjs'
      - 'export-workspace.js'
      - 'scripts/test-compact-exam-sidebar.cjs'
      - 'data/lemmas/teacher-forms.json'
      - 'data/lemmas/verified-overrides.json'
      - 'exam-scoring.js'
      - 'scripts/test-phase-one.cjs'
      - 'scripts/test-latin-passive-phrases.cjs'
      - 'vocabulary-generator.js'
      - 'scripts/test-phase-five.cjs'
      - 'scripts/test-phase-six.cjs'
      - 'scripts/test-greek-morph-regeneration.cjs'
      - 'scripts/test-greek-verb-syncretism.cjs'
      - 'scripts/test-greek-movable-nu.cjs'
      - 'scripts/test-greek-movable-nu-browser.cjs'
      - 'scripts/test-greek-ud5-quota-indent.cjs'
      - 'scripts/test-greek-two-ending-adjectives.cjs'
      - 'scripts/test-greek-adjective-accent-vocative.cjs'
      - 'scripts/test-greek-pragma-third-decl.cjs'
      - 'scripts/test-greek-third-decl-gender-five.cjs'
      - 'scripts/test-greek-ud8-lexical-accents.cjs'
      - 'scripts/test-greek-lexical-filology-20261121.cjs'
      - 'scripts/test-greek-lexical-followup-20261121.cjs'
      - 'scripts/test-filologia-latin-griego-20261121.cjs'
      - 'scripts/test-greek-sentence-philology-20261121.cjs'
      - 'scripts/test-greek-aorist-attestation-20261121.cjs'
      - 'scripts/test-filologia-regimen-acento-20261121.cjs'
      - 'scripts/test-greek-noun-case-attestation-20261121.cjs'
      - 'scripts/test-greek-all-unit-form-quotas.cjs'
      - 'scripts/test-morph-quotas-curriculum-regeneration.cjs'
      - 'scripts/test-greek-two-modes-legacy-drafts.cjs'
      - 'scripts/test-greek-ui.cjs'
      - 'tests/test_unimorph*.py'
      - 'scripts/test-greek-reviewed-nominal-expansion.cjs'
      - 'scripts/test-exam-ui-redesign.cjs'
      - 'scripts/test-examinator-theme.cjs'
      - 'scripts/test-toolbar-button-sizes.cjs'
      - 'scripts/test-word-palatino.cjs'
      - 'scripts/test-word-gloss-columns.cjs'
      - 'scripts/test-lemma-review-theme.cjs'
      - 'scripts/test-latin4-conjugation-isolated-forms.cjs'
      - 'scripts/test-subquestion-scoring.cjs'
      - 'scripts/test-greek-choice-*.cjs'
      - '.github/workflows/phase-one-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Word, preview, drafts, morphology and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Rebuild offline distribution in CI workspace
        run: npm run offline:build
      - name: Clasificación curricular UniMorph
        run: python3 -m unittest discover -s tests
      - name: Griego I, 14 unidades y menú móvil
        run: node scripts/test-greek-ui.cjs
      - name: Griego I dos modelos, enunciado seleccionable y migración de borradores
        run: node scripts/test-greek-two-modes-legacy-drafts.cjs
      - name: Verificar procedencia individual de sustantivos y adjetivos griegos
        run: node scripts/test-greek-reviewed-nominal-expansion.cjs
      - name: Auditar las cuatro cuotas morfológicas griegas en las 14 unidades
        run: node scripts/test-greek-all-unit-form-quotas.cjs
      - name: Regeneración morfológica y progresión gramatical en griego y latín
        run: node scripts/test-morph-quotas-curriculum-regeneration.cjs
      - name: Griego I competencias, filología, Word, PDF y offline
        run: node scripts/test-greek-choice-groups.cjs && node scripts/test-greek-choice-audit.cjs && node scripts/test-greek-choice-bullets-spacing.cjs && node scripts/test-greek-complete-ud5-regressions.cjs && node scripts/test-greek-choice-number-glossary.cjs && node scripts/test-greek-choice-semantics-and-isolation.cjs
      - name: Auditar étimos distintos y raíces estudiadas en Griego I (ES/VA, web y PWA)
        run: node scripts/test-greek-etymology-distinct-roots.cjs
      - name: Sintagmas griegos, enunciados completos, clases 2-2 y pronombres desde UD7
        run: node scripts/test-syntagm-variation.cjs && node scripts/test-sintagmas-aprobados-169.cjs
      - name: Phase I synchronization regressions
        run: node scripts/test-phase-one.cjs
      - name: Verificar interfaz de guardar/exportar y PDF local sin publicar
        run: node scripts/test-export-workspace.cjs
      - name: Comprobar compacidad del panel izquierdo, accesos seguros y valenciano
        run: node scripts/test-compact-exam-sidebar.cjs
      - name: Interpretaciones opcionales del perfecto pasivo y pluscuamperfecto en latín
        run: node scripts/test-latin-passive-phrases.cjs
      - name: Greek morphology regeneration web and offline
        run: node scripts/test-greek-morph-regeneration.cjs
      - name: Preservar sincretismos griegos al crear y regenerar formas verbales
        run: node scripts/test-greek-verb-syncretism.cjs
      - name: Validar ν móvil en 14 UD, ES/VA, web y PWA
        run: |
          node scripts/test-greek-movable-nu.cjs
          node scripts/test-greek-movable-nu-browser.cjs
      - name: Greek UD5 noun, adjective and verb quotas; Word and screen indent
        run: node scripts/test-greek-ud5-quota-indent.cjs
      - name: Griego UD5, adjetivos de dos terminaciones en fichas y regeneraciones
        run: node scripts/test-greek-two-ending-adjectives.cjs
      - name: "Griego UD5: ὀλίγος y πολύς, acentos, vocativos y migración local"
        run: node scripts/test-greek-adjective-accent-vocative.cjs
      - name: "Griego UD8: πρᾶγμα y artículo de tercera declinación"
        run: node scripts/test-greek-pragma-third-decl.cjs
      - name: "Griego: cinco enunciados de tercera declinación y migración segura"
        run: node scripts/test-greek-third-decl-gender-five.cjs
      - name: "Griego UD8: cinco acentos y enunciados léxicos"
        run: node scripts/test-greek-ud8-lexical-accents.cjs
      - name: "Griego I: acentos del exigible y valores de διά"
        run: node scripts/test-greek-lexical-filology-20261121.cjs
      - name: Griego I lemas generales, acentos y catálogo provisional
        run: node scripts/test-greek-lexical-followup-20261121.cjs
      - name: Auditar cantidades filologicas y vocabulario grecolatino
        run: node scripts/test-filologia-latin-griego-20261121.cjs --offline
      - name: Segunda ronda filológica de oraciones, acentos y aoristos
        run: node scripts/test-greek-sentence-philology-20261121.cjs --offline
      - name: Comprobar tres aoristos con evidencias y cero promociones morfológicas
        run: node scripts/test-greek-aorist-attestation-20261121.cjs
      - name: Auditar régimen verbal, demonstrativos y concordancias restantes
        run: node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Atestación aislada del dativo en -ματι sin promoción morfológica
        run: node scripts/test-greek-noun-case-attestation-20261121.cjs
      - name: Exam UI redesign in iPad, forms, Word and vocabulary isolation
        run: node scripts/test-exam-ui-redesign.cjs
      - name: Verificar tema Examinator sin efectos sobre Word/PDF
        run: node scripts/test-examinator-theme.cjs
      - name: Comprobar igualdad y desbordamientos de botones en iPad y móvil
        run: node scripts/test-toolbar-button-sizes.cjs
      - name: Verificar fuente Palatino Linotype en Word de las tres materias
        run: node scripts/test-word-palatino.cjs
      - name: Verificar glosario Word como párrafos en dos columnas reales
        run: node scripts/test-word-gloss-columns.cjs
      - name: Verificar tarjetas de revisión de lemas y selección sin regresiones
        run: node scripts/test-lemma-review-theme.cjs
      - name: Auditoría de lematización de oraciones y opciones docentes
        run: node scripts/test-exam-glossary.cjs
      - name: Consultas Collatinus y Eulexis, confirmación docente y exportación
        run: node scripts/test-exam-external-gloss.cjs
      - name: Latin 4 regular conjugations and isolated form counts
        run: node scripts/test-latin4-conjugation-isolated-forms.cjs
      - name: All existing Word preview regressions
        run: npm run preview:test
      - name: Phase V responsive editing and Word regressions
        run: node scripts/test-phase-five.cjs
      - name: Phase VI ten points, drafts and Word regressions
        run: node scripts/test-phase-six.cjs
      - name: Phase VI subquestion scoring, drafts and lexical alternatives
        run: node scripts/test-subquestion-scoring.cjs
      - name: Vocabulary regressions
        run: npm run vocabulary:test
      - name: Offline consistency
        run: npm run offline:test
      - name: PWA browser regressions
        run: npm run pwa:test
