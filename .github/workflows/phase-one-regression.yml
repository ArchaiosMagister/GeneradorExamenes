name: Phase I regression (no deployment)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'exam-scoring.js'
      - 'scripts/test-phase-one.cjs'
      - '.github/workflows/phase-one-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Word, preview, drafts, morphology and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Rebuild offline distribution in CI workspace
        run: npm run offline:build
      - name: Phase I synchronization regressions
        run: node scripts/test-phase-one.cjs
      - name: All existing Word preview regressions
        run: npm run preview:test
      - name: Vocabulary regressions
        run: npm run vocabulary:test
      - name: Offline consistency
        run: npm run offline:test
      - name: PWA browser regressions
        run: npm run pwa:test
      - name: Keep offline.html in sync on the review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- offline.html; then
            echo "offline.html already matches the validated source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "Build offline distribution for phase I review branch"
          git push origin "HEAD:${{ github.head_ref }}"
