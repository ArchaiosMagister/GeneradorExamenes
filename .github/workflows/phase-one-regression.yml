name: Phase I regression (no deployment)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'exam-scoring.js'
      - 'scripts/test-phase-one.cjs'
      - 'scripts/test-phase-five.cjs'
      - 'scripts/test-phase-six.cjs'
      - 'scripts/test-greek-morph-regeneration.cjs'
      - 'scripts/test-exam-ui-redesign.cjs'
      - 'scripts/test-subquestion-scoring.cjs'
      - '.github/workflows/phase-one-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Word, preview, drafts, morphology and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Rebuild offline distribution in CI workspace
        run: npm run offline:build
      - name: Phase I synchronization regressions
        run: node scripts/test-phase-one.cjs
      - name: Greek morphology regeneration web and offline
        run: node scripts/test-greek-morph-regeneration.cjs
      - name: Exam UI redesign in iPad, forms, Word and vocabulary isolation
        run: node scripts/test-exam-ui-redesign.cjs
      - name: All existing Word preview regressions
        run: npm run preview:test
      - name: Phase V responsive editing and Word regressions
        run: node scripts/test-phase-five.cjs
      - name: Phase VI ten points, drafts and Word regressions
        run: node scripts/test-phase-six.cjs
      - name: Phase VI subquestion scoring, drafts and lexical alternatives
        run: node scripts/test-subquestion-scoring.cjs
      - name: Vocabulary regressions
        run: npm run vocabulary:test
      - name: Offline consistency
        run: npm run offline:test
      - name: PWA browser regressions
        run: npm run pwa:test
