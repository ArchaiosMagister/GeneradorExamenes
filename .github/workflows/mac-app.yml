name: Compilar aplicación para Mac (Apple Silicon)

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  macos-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Rust para Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Verificar código de la interfaz
        run: node scripts/check-web.mjs

      - name: Instalar herramientas y preparar interfaz
        run: |
          npm install --no-audit --no-fund
          npm run desktop:prepare

      - name: Compilar aplicación Tauri
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Empaquetar .app en ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/GeneradorExamenes-Mac-AppleSilicon.zip"

      - name: Publicar artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorExamenes-Mac-AppleSilicon
          path: dist/GeneradorExamenes-Mac-AppleSilicon.zip
          if-no-files-found: error
          retention-days: 30
