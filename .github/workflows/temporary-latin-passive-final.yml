name: Verificar y sincronizar perífrasis latinas (temporal, sin publicar)
on:
  push:
    branches: [feat/latin-passive-phrase-choices-20261115]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir el archivo autónomo y comprobar consistencia
        run: node scripts/build-offline.mjs && node scripts/test-offline.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Probar decisiones independientes, Word, valenciano y versión autónoma
        run: node scripts/test-latin-passive-phrases.cjs
      - name: Sincronizar HTML solo tras superar las pruebas
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar opciones de perífrasis latinas offline"
            git push origin HEAD:feat/latin-passive-phrase-choices-20261115
          fi
