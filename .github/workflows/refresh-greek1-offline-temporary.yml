name: Regenerar offline solo en rama de auditoría (temporal)
on:
  push:
    branches: [audit/greek1-lexicon-socrates-akroama-20261121]
    paths:
      - 'index.html'
      - 'data/lemmas/teacher-forms.json'
      - 'vocabulary-generator.js'
      - 'lexicon-valenciano.js'
      - '.github/workflows/refresh-greek1-offline-temporary.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'ArchaiosMagister/GeneradorExamenes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir archivo único sin publicar
        run: npm run offline:build
      - name: Guardar exclusivamente offline.html en la rama aislada
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- offline.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add offline.html
            git commit -m "build: sincronizar offline.html de auditoría griega"
            git push origin HEAD:audit/greek1-lexicon-socrates-akroama-20261121
          fi
