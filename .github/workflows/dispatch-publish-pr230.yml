name: Solicitar publicación autorizada PR 230
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/publicar-pr230-95bc671'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Solicitar despliegue del commit exacto ya validado
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: 95bc671bafb5ee213e124b4a2e173999161dd03d
          CI_RUN: '46008360086'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" | jq -e --arg sha "$COMMIT" 'select(.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/offline-check.yml")' > /dev/null
          gh workflow run publish-online.yml --repo "$GITHUB_REPOSITORY" --ref main -f "commit=$COMMIT" -f "ci_run=$CI_RUN"
