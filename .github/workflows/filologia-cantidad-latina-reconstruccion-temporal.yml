name: Actualizar cantidades latinas sin publicacion
on:
  push:
    branches:
      - fix/auditoria-filologica-latin-griego-20261121
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir el índice y la versión autónoma
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
          node scripts/test-filologia-cantidad-latina-20261121.cjs --offline
          node scripts/test-greek-aorist-attestation-20261121.cjs
          node scripts/test-greek-noun-case-attestation-20261121.cjs
          node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Sincronizar los ficheros y autodestruir esta tarea de mantenimiento
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lemmas/teacher-forms.json offline.html
          git rm ".github/workflows/filologia-cantidad-latina-reconstruccion-temporal.yml"
          git commit -m "build: sincronizar cantidades de Africa y agricola"
          git push origin "HEAD:fix/auditoria-filologica-latin-griego-20261121"
