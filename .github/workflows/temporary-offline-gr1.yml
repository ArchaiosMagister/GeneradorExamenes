name: Rebuild offline artifact for Greek UD5 fixes (temporary)
on:
  push:
    branches:
      - fix/gr1-ud5-mixed-adjectives-gloss-prepositions-20261118
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate standalone HTML without network input
        run: npm run offline:build
      - name: Commit only generated offline.html
        shell: bash
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: synchronize standalone offline HTML"
            git push origin HEAD:fix/gr1-ud5-mixed-adjectives-gloss-prepositions-20261118
          fi
