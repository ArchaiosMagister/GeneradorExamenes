name: Publicar webapp online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener la versión actual
        uses: actions/checkout@v4
      - name: Preparar Node.js para el índice bilingüe
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir el lematizador y la versión autónoma
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
      - name: Preparar web publicada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp offline.html _site/offline.html
          cp offline-lemmas.js _site/offline-lemmas.js
          cp pwa.js manifest.webmanifest _site/
          cp -R icons _site/icons
          sed "s/__PWA_BUILD_VERSION__/${GITHUB_SHA}/g" sw.js > _site/sw.js
          cp -R data _site/data
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/offline.html
          test -s _site/sw.js
          test -s _site/icons/icon-512.png
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
