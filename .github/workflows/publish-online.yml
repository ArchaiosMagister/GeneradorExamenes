name: Publicar webapp online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No reconstruir la PR 29: su generador de vocabulario ya está consolidado
# en main. Una única versión evita código y cachés de una vista obsoleta.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener versión estable
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bloquear publicación si se revierten decisiones fonéticas docentes
        run: |
          node scripts/test-criterios-foneticos.mjs
          node scripts/test-fonetica.mjs
          node scripts/test-lat1-fonetica.mjs
      - name: Reconstruir el índice desde el extracto griego versionado
        run: |
          node scripts/build-lemma-index.mjs
          git diff --exit-code -- data/lemmas/teacher-forms.json
          node scripts/test-revision-559-griego.cjs
          node scripts/test-echthros-ten-collation.cjs
      - name: Construir y validar versión autónoma
        run: |
          npm run offline:build
          git diff --exit-code -- offline.html
          npm run offline:test
          node scripts/test-lemma-index.mjs
          node scripts/test-vocabulary-quality.cjs
      - name: Preparar publicación de main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html offline.html _site/
          for asset in offline-lemmas.js verification-review.js greek-review.js eulexis-local.js culture-lat4.js lexicon-valenciano.js required-latin-units.js vocabulary-quality.js vocabulary-generator.js exam-scoring.js unified-backup.js pwa.js manifest.webmanifest; do
            test -f "$asset"
            cp "$asset" _site/
          done
          cp -R icons data _site/
          if [[ -d THIRD_PARTY_LICENSES ]]; then cp -R THIRD_PARTY_LICENSES _site/; fi
          if [[ -f docs/lematizacion-lectores.md ]]; then
            mkdir -p _site/docs
            cp docs/lematizacion-lectores.md _site/docs/
          fi
          sed "s/__PWA_BUILD_VERSION__/${{ github.sha }}/g" sw.js > _site/sw.js
          test -s _site/index.html
          test -s _site/offline.html
          test -s _site/data/lemmas/teacher-forms.json
          test -s _site/sw.js
          test -s _site/icons/icon-512.png
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
