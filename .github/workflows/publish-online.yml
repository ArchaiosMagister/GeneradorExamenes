name: Publicar artefacto validado

on:
  workflow_dispatch:
    inputs:
      commit:
        description: SHA completo de main autorizado para publicar
        required: true
        type: string
      ci_run:
        description: ID de la ejecución satisfactoria de CI obligatoria para ese SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Comprobar procedencia y preparar el artefacto
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exigir CI satisfactoria del mismo SHA de main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          CI_RUN: ${{ inputs.ci_run }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ && "$CI_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")
          jq -er --arg sha "$COMMIT" --arg repo "$GITHUB_REPOSITORY" '
            select(.path == ".github/workflows/offline-check.yml"
              and .head_branch == "main" and .head_sha == $sha
              and .head_repository.full_name == $repo
              and (.event == "push" or .event == "workflow_dispatch")
              and .status == "completed" and .conclusion == "success")
            | .id' <<< "$ci"
          echo "artifact=site-ci-$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.ci.outputs.artifact }}
          run-id: ${{ inputs.ci_run }}
          github-token: ${{ github.token }}
          path: validated
      - name: Validar el paquete recibido
        working-directory: validated
        run: |
          set -euo pipefail
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          sha256sum --strict --check SHA256SUMS
          mkdir ../_site
          tar -xf site.tar -C ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

  publish:
    name: Desplegar en GitHub Pages
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar que main sigue en el commit autorizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Publicar el artefacto verificado
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
