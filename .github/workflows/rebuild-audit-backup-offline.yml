name: Regenerar offline para auditoría II (temporal)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rebuild-audit-backup-offline.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/backup-safety-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test unified backup
        run: node scripts/test-unified-backup.cjs
      - name: Rebuild standalone offline HTML
        run: npm run offline:build
      - name: Commit the rebuilt standalone file only
        run: |
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(offline): sync archive safety corrections"
          git push origin HEAD:refs/heads/audit/backup-safety-20261118
