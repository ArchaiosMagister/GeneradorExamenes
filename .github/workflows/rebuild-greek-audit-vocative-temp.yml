name: Reconstrucción aislada de PWA para corregir regresión griega
on:
  push:
    branches:
      - audit/greek1-oligos-polys-20261121
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir la PWA sin alterar material académico
        run: npm run offline:build
      - name: Verificar paradigmas ὀλίγος/πολύς y persistencia docente
        run: node scripts/test-greek-adjective-accent-vocative.cjs
      - name: Verificar actualización reproducible del índice
        run: git diff --exit-code -- data/lemmas/teacher-forms.json
      - name: Guardar solo la PWA de la rama aislada
        run: |
          if ! git diff --quiet -- offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline.html
            git commit -m 'build: sincronizar PWA tras reparar variedad de πολύς'
            git push
          fi
