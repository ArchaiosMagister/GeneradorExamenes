name: Sincronizar offline de espaciados de la rama (sin despliegue)
on:
  push:
    branches: [feat/export-workspace-pdf-20261115]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML autónomo
        run: node scripts/build-offline.mjs
      - name: Comprobar reproducibilidad y sintaxis de scripts
        run: node scripts/test-offline.mjs
      - name: Sincronizar sólo en la rama de la PR
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar espaciados Word y vista previa en offline"
            git push origin HEAD:feat/export-workspace-pdf-20261115
          fi
