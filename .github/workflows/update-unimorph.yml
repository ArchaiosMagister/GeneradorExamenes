name: Actualizar bancos UniMorph
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar clasificación curricular
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Construir índices compactos
        run: python scripts/build_unimorph.py
      - name: Construir consulta completa por forma y lema
        run: python scripts/build_unimorph_lookup.py
      - name: Conservar índices para revisión
        uses: actions/upload-artifact@v4
        with:
          name: unimorph-para-revision-${{ github.sha }}
          path: data/unimorph/
          if-no-files-found: error
          retention-days: 30
