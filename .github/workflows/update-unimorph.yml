name: Actualizar bancos UniMorph
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar clasificación curricular
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Construir índices compactos
        run: python scripts/build_unimorph.py
      - name: Construir consulta completa por forma y lema
        run: python scripts/build_unimorph_lookup.py
      - name: Guardar índices publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unimorph
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar bancos morfológicos UniMorph"
            git push
          fi
