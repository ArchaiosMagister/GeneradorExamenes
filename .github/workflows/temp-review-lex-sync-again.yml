name: Sincronizar Word Eulexis offline temporal
on:
  push:
    branches: [feat/exam-review-evolutio-greek-candidates-20261117]
    paths: [.github/workflows/temp-review-lex-sync-again.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-lex-review-eulexis.cjs
          node scripts/check-web.mjs
          npm run offline:build
      - name: Actualizar offline y retirar workflow temporal sin publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-review-lex-sync-again.yml
          git add offline.html .github/workflows/temp-review-lex-sync-again.yml
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar Eulexis offline y retirar workflow temporal"
            git push origin HEAD:feat/exam-review-evolutio-greek-candidates-20261117
          fi
