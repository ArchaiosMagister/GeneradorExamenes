name: Reproducir HTML autónomo de paradigmas latinos (sin desplegar)
on:
  push:
    branches:
      - fix/latin-paradigm-vir-20261122
    paths:
      - '.github/workflows/temporary-rebuild-latin-paradigms-20261122.yml'
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout rama de auditoría
        uses: actions/checkout@v4
        with:
          ref: fix/latin-paradigm-vir-20261122
          fetch-depth: 1
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir y revisar salida
        run: |
          node scripts/build-offline.mjs
          git diff --check
          node -e "const s=require('fs').readFileSync('offline.html','utf8');for(const n of ['iter: \"'longus','mortium'])if(!s.includes(n))process.exit(1)"
      - name: Guardar resultado y retirar flujo temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/temporary-rebuild-latin-paradigms-20261122.yml
          git commit -m 'build(lat): sincronizar autónoma con paradigmas de vir, mors e iter'
          git push origin HEAD:refs/heads/fix/latin-paradigm-vir-20261122
