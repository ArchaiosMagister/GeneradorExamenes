name: Phase II grammar and curricular coverage (no deployment)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'offline.html'
      - 'scripts/test-phase-two.cjs'
      - '.github/workflows/phase-two-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curriculum:
    name: Curriculum, morphology, DOCX and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Rebuild standalone HTML in the CI workspace
        run: npm run offline:build
      - name: Curricular forms and paradigms
        run: node scripts/test-phase-two.cjs
      - name: Phase I bidirectional editor regression
        run: node scripts/test-phase-one.cjs
      - name: Document export and seven exam models
        run: npm run preview:test
      - name: Bank and lemmatization regressions
        run: npm run vocabulary:test
      - name: Offline reproducibility
        run: npm run offline:test
      - name: PWA offline and update regression
        run: npm run pwa:test
      - name: Rebuild offline.html on the review branch after all checks pass
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- offline.html; then
            echo "Autonomous HTML is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "Rebuild offline distribution for phase II review"
          git push origin "HEAD:${{ github.head_ref }}"
