name: Sync Latin nominal fixes to autonomous HTML (temporary)
on:
  push:
    branches:
      - fix/latin-nominal-verified-selection-20261120
    paths:
      - '.github/workflows/sync-latin-nominal-offline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin-nominal-verified-selection-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild offline.html from checked-in sources
        run: npm run offline:build
      - name: Commit only the deterministic autonomous artifact
        shell: bash
        run: |
          if git diff --quiet -- offline.html; then
            echo "Already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "Sync autonomous HTML with approved Latin nominal corrections"
          git push origin HEAD:fix/latin-nominal-verified-selection-20261120
