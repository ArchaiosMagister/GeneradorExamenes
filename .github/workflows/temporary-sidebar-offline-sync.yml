name: Temporary exam sidebar offline synchronization
on:
  push:
    branches:
      - style/compact-exam-editor-sidebar-20261117
    paths:
      - .github/workflows/temporary-sidebar-offline-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild standalone HTML from canonical code
        run: npm run offline:build
      - name: Record generated standalone version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- offline.html; then exit 0; fi
          git add offline.html
          git commit -m "build: regenerate offline HTML after compact sidebar changes"
          git push origin HEAD:style/compact-exam-editor-sidebar-20261117
