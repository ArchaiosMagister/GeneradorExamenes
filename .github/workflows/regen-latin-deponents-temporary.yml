name: Temporal - regenerar offline tras auditoría de deponentes
on:
  push:
    branches:
      - fix/latin-deponents-ud7-ud9-editorial-20261122
permissions:
  contents: write
jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin-deponents-ud7-ud9-editorial-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir versión autónoma desde fuente actual
        run: node scripts/build-offline.mjs
      - name: Comprobar dos correcciones y autoretirar el workflow
        run: |
          set -euo pipefail
          test -s offline.html
          grep -F -q 'complector, complexus sum (3ª)' offline.html
          grep -F -q 'patior, passus sum (mx.)' offline.html
          ! grep -F -q 'complector, complectus sum (3ª)' offline.html
          ! grep -F -q 'patior, passus sum (4ª)' offline.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regen-latin-deponents-temporary.yml
          git add -f offline.html
          git add -u .github/workflows/regen-latin-deponents-temporary.yml
          git diff --cached --stat
          git commit -m "build: sincronizar offline tras dos correcciones deponentes"
          git push origin HEAD:fix/latin-deponents-ud7-ud9-editorial-20261122
