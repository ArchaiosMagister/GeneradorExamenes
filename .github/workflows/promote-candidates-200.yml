name: Transferir 200 análisis a banco revisado (solo rama)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/promote-candidates-200.cjs'
      - 'scripts/test-candidaturas-lote200.cjs'
      - 'data/lemmas/revision-candidaturas-lote200-20261113.json'
      - '.github/workflows/promote-candidates-200.yml'

permissions:
  contents: write

jobs:
  incorporar-sin-publicar:
    if: github.head_ref == 'revision-filologica-integral-20261113' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrar exactamente 100 fichas latinas y 100 griegas
        run: node scripts/promote-candidates-200.cjs
      - name: Regenerar archivo HTML totalmente autónomo
        run: npm run offline:build
      - name: Comprobar correspondencia de 200 casillas y concordancia curricular
        run: node scripts/test-candidaturas-lote200.cjs
      - name: Comprobar lote anterior y lemas sin duplicaciones
        run: node scripts/test-candidaturas-lote100.cjs && node scripts/test-lemma-index.mjs
      - name: Contrastar paradigmas latinos y fuentes verificadas
        run: node scripts/test-latin-verb-evidence.cjs && node scripts/test-verified-verb-overrides.cjs
      - name: Auditar gramática y edición filológica griegas
        run: node scripts/test-greek-editorial.cjs && node scripts/test-greek-nominal-persistent.cjs
      - name: Verificar paridad de fuente persistente, generador y PWA
        run: node scripts/test-phase-two-persistent-offline.cjs && node scripts/test-offline.mjs
      - name: Auditar todas las candidaturas restantes sin autoaprobar
        run: node scripts/test-comprehensive-morph-audit.cjs
      - name: Confirmar que la reconstrucción offline es reproducible
        run: |
          cp offline.html /tmp/lote200-offline.html
          npm run offline:build
          cmp offline.html /tmp/lote200-offline.html
          git diff --check
      - name: Confirmar que ninguna unidad fue inventada
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const d=require('./data/lemmas/teacher-forms.json');
          const l=require('./data/lemmas/revision-candidaturas-lote200-20261113.json');
          assert.equal(l.summary.promoted,200);
          for(const x of l.rows){
            const c=x.language==='lat'?'lat1':'gr1';
            assert(d.vocabulary[x.language][x.lemma][c].units.length>0);
          }
          console.log('200 lecturas conservan unidades del banco docente.');
          NODE
      - name: Guardar cambios como un único commit solamente si todas las pruebas pasan
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lemmas/teacher-forms.json data/lemmas/verified-overrides.json \
            data/lemmas/revision-candidaturas-lote200-20261113.json \
            index.html offline.html scripts/build-lemma-index.mjs \
            scripts/test-comprehensive-morph-audit.cjs scripts/test-latin-verb-evidence.cjs \
            docs/revision-filologica-integral-20261113.md
          if git diff --cached --quiet; then
            echo "Sin modificaciones nuevas"
          else
            git commit -m "feat(filologia): verificar 100 análisis latinos y 100 griegos sin publicación"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
