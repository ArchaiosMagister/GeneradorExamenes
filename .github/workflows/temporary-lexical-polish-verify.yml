name: Temporal · sincronizar y validar revisión léxica sin publicar
on:
  push:
    branches:
      - feat/lexical-review-eulexis-refinements-20261117
permissions:
  contents: write
jobs:
  lexical:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código editorial
        run: |
          node --check scripts/test-editorial-lexical-polish.cjs
          node --check scripts/build-offline.mjs
      - name: Reconstruir versión offline
        run: npm run offline:build
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar léxico, glosario y exportaciones sin regresiones
        run: |
          node scripts/test-editorial-lexical-polish.cjs
          node scripts/test-lemma-review-theme.cjs
          node scripts/test-exam-external-gloss.cjs
          node scripts/test-lat4-lexico.cjs
          node scripts/test-greek-choice-groups.cjs
          node scripts/test-per-question-visual-format.cjs
      - name: Guardar HTML autónomo solo tras aprobar todas las comprobaciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar HTML autónomo con revisión editorial y léxica"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
