name: Solicitar publicación autorizada PR 232
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/publicar-pr232-58a2ed0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Esperar CI exacta y solicitar despliegue oficial
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: 58a2ed05dc884c9d340becf82cf07b943d481f53
          CI_RUN: '46015011368'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$COMMIT"
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")"
            jq -e --arg sha "$COMMIT" 'select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .path == ".github/workflows/offline-check.yml")' <<< "$run" > /dev/null
            if [ "$(jq -r .status <<< "$run")" = completed ]; then
              test "$(jq -r .conclusion <<< "$run")" = success
              gh workflow run publish-online.yml --repo "$GITHUB_REPOSITORY" --ref main -f "commit=$COMMIT" -f "ci_run=$CI_RUN"
              exit 0
            fi
            sleep 30
          done
          echo "CI no finalizada dentro del límite" >&2
          exit 1
