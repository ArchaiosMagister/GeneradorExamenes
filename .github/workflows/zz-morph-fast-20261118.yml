name: TEMP targeted morphology checks
on:
  push:
    branches:
      - fix/morph-quotas-curricular-variety-20261118
    paths:
      - 'scripts/test-morph-quotas-curriculum-regeneration.cjs'
      - 'index.html'
      - '.github/workflows/zz-morph-fast-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm run offline:build
      - run: node scripts/test-morph-quotas-curriculum-regeneration.cjs
