name: Regenerar HTML autónomo (tarea temporal PR 230)
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.pull_request.number == 230 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/latin4-sangria-vinetas'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin4-sangria-vinetas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir distribución y retirar tarea temporal
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/latin4-sangria-vinetas
          npm run offline:build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/rebuild-offline-pr230.yml
          git commit -m "Regenera HTML autónomo y retira tarea temporal"
          git push origin HEAD:refs/heads/fix/latin4-sangria-vinetas
