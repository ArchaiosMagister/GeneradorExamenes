name: Verificar morfología y léxico offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/check-web.mjs
      - run: node scripts/prepare-desktop.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-morphology.cjs
