# Temporal: PR 169. Verifica la nueva elegibilidad por clase gramatical;
# sincroniza offline.html exclusivamente en esta rama y nunca publica.
name: PR169 verificar sintagmas por tipo
on:
  push:
    branches:
      - feat/exam-review-evolutio-greek-candidates-20261117
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regresión del motor aislado
        run: node scripts/test-exam-models.cjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Comprobar elegibilidad curricular por declinación y clase
        run: node scripts/test-sintagmas-aprobados-169.cjs
      - name: Comprobar concordancias y variedades anteriores
        run: |
          node scripts/test-nominal-agreement.cjs
          node scripts/test-syntagm-variation.cjs
      - name: Sincronizar versión autónoma
        run: npm run offline:build
      - name: Subir sólo la versión autónoma a rama sin publicar
        run: |
          if git diff --quiet -- offline.html; then
            echo "offline.html sin cambios"
            exit 0
          fi
          git add -- offline.html
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: sincronizar offline.html con sintagmas por categoría gramatical"
          git push origin "HEAD:${GITHUB_REF_NAME}"
