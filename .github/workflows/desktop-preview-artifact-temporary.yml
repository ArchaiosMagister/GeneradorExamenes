name: Preparar descarga privada de variante escritorio (sin publicación)
on:
  push:
    branches: [experiment/desktop-interface-four-areas-20261116]
    paths: ['.github/workflows/desktop-preview-artifact-temporary.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar que el HTML autónomo existe
        run: test -s offline.html
      - name: Adjuntar versión autónoma de prueba
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorExamenes-InterfazEscritorio-PR150
          path: offline.html
          if-no-files-found: error
          retention-days: 14
