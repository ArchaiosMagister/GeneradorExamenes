name: Reconstruir temporalmente índice y PWA para tercera declinación
on:
  push:
    branches:
      - audit/greek1-third-decl-pragma-20261121
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice con corrección editorial persistente
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir HTML autónomo
        run: npm run offline:build
      - name: Validar ambos lotes de auditoría filológica
        run: |
          node scripts/test-greek-adjective-accent-vocative.cjs
          node scripts/test-greek-pragma-third-decl.cjs
      - name: Guardar únicamente índice y PWA de esta rama aislada
        run: |
          if ! git diff --quiet -- data/lemmas/teacher-forms.json offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/lemmas/teacher-forms.json offline.html
            git commit -m 'build: sincronizar índice y PWA tras corrección de πρᾶγμα'
            git push
          fi
