name: Sincronizar corrección impersonal tras pruebas (temporal)
on:
  push:
    branches: [fix/passive-impersonal-pugnatum-20261115]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir HTML autónomo
        run: node scripts/build-offline.mjs && node scripts/test-offline.mjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Validar voces pasivas y selecciones en web y offline
        run: node scripts/test-latin-passive-phrases.cjs
      - name: Guardar HTML autónomo generado
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: actualizar HTML autónomo con mejor índice de pasivas"
            git push origin HEAD:fix/passive-impersonal-pugnatum-20261115
          fi
