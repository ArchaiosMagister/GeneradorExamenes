name: Sincronización temporal del formato griego autónomo
on:
  push:
    branches: [fix/greek-pdf-glossary-gap-20261116]
    paths:
      - '.github/workflows/sync-offline-gloss-gap-temporary.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar HTML autónomo desde la misma rama
        run: |
          set -euo pipefail
          npm run offline:build
          git add offline.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sincronizar espacio del glosario griego en HTML autónomo'
            git push origin HEAD:fix/greek-pdf-glossary-gap-20261116
          fi
