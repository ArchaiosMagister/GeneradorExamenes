name: Temporal - inventariar aserciones de fuentes verificadas
on:
  push:
    branches:
      - fix/latin-deponents-ud7-ud9-editorial-20261122
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latin-deponents-ud7-ud9-editorial-20261122
          persist-credentials: true
      - name: Listar todas las referencias históricas a 619 y 570 en scripts y pruebas
        shell: bash
        run: |
          echo '=== 619 ==='
          grep -Rn -E '(^|[^[:digit:]])619([^[:digit:]]|$)' scripts/ .github/workflows/ || true
          echo '=== 570 ==='
          grep -Rn -E '(^|[^[:digit:]])570([^[:digit:]]|$)' scripts/ .github/workflows/ || true
          echo '=== TOTALS ==='
          grep -Rn -E 'counts\.lat\.contrastado|total,594' scripts/ || true
      - name: Retirar el workflow temporal al terminar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/grep-assertions-temporary.yml
          git commit -m "ci: retirar workflow de auditoría de aserciones históricas"
          git push origin HEAD:fix/latin-deponents-ud7-ud9-editorial-20261122
