name: Reconstrucción temporal de deponentes UD9-10 (sin publicación)
on:
  pull_request:
    branches:
      - fix/latin-deponents-ud7-ud9-editorial-20261122
    paths:
      - '.github/workflows/rebuild-deponents-ud9-10-temporary.yml'
  push:
    branches:
      - fix/latin-deponents-ud9-ud10-present-20261122
    paths:
      - '.github/workflows/rebuild-deponents-ud9-10-temporary.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice exactamente desde fuentes fijadas
        run: |
          node scripts/build-lemma-index.mjs
          node -e "const c=require('./data/lemmas/teacher-forms.json'); if(c.counts.lat.contrastado!==667||c.rows.lat.length!==14555)throw Error('Recuento inesperado');"
      - name: Reconstruir HTML autónomo sin cambios en bancos históricos
        run: npm run offline:build
      - name: Validar los dos bloques deponentes y sus límites
        run: |
          node scripts/test-latin-deponents-ud7-ud9-20261122.cjs --source-only
          node scripts/test-latin-deponents-ud9-ud10-present-20261122.cjs --source-only
          node scripts/test-latin-verb-evidence.cjs
          node scripts/test-latin-verb-corpus-audit.cjs
          node scripts/test-verified-verb-overrides.cjs
          node scripts/test-lemma-index.mjs
      - name: Autoretirar este workflow temporal y guardar solo artefactos reproducibles
        run: |
          git diff --name-only | tee /tmp/changed-files
          if grep -Ev '^(data/lemmas/teacher-forms.json|offline.html)$' /tmp/changed-files; then
            echo "Cambio inesperado al reconstruir"; exit 1
          fi
          test -s /tmp/changed-files
          rm .github/workflows/rebuild-deponents-ud9-10-temporary.yml
          git add data/lemmas/teacher-forms.json offline.html .github/workflows/rebuild-deponents-ud9-10-temporary.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: reproducir indice y HTML autónomo con 24 presentes UD9-10'
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
