name: Reconstrucción temporal de correcciones verbales latinas
on:
  push:
    branches:
      - fix/latin-verb-lexical-integrity-20261120
    paths:
      - '.github/workflows/rebuild-latin-verb-artifacts.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice desde la fuente fijada y las correcciones editoriales
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir HTML autónomo desde la misma fuente
        run: npm run offline:build
      - name: Comprobar correcciones verbales y migración de listas exigibles
        run: node scripts/test-latin-verb-entry-integrity.cjs
      - name: Verificar lematización sin promociones automáticas
        run: node scripts/test-lemma-index.mjs
      - name: Verificar vocabulario exigible y perfectos
        run: node scripts/test-required-latin-vocabulary.cjs
      - name: Validar paradigma irregular/deponente persistente
        run: node scripts/test-latin-verb-evidence.cjs
      - name: Publicar los dos artefactos reproducibles SOLO en rama aislada
        run: |
          git status --short
          git add data/lemmas/teacher-forms.json offline.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(latin): synchronize corrected lemma index and standalone HTML'
            git push origin HEAD:fix/latin-verb-lexical-integrity-20261120
          fi
