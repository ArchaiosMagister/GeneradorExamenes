name: Sincronizar HTML autónomo de léxico (temporal)
on:
  push:
    branches:
      - fix/lexico-optativo-editores-20261114
    paths:
      - index.html
      - exam-scoring.js
      - .github/workflows/lexico-offline-sync.yml
concurrency:
  group: lexico-offline-unica-rama
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lexico-optativo-editores-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar y registrar offline.html solo en esta rama
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin fix/lexico-optativo-editores-20261114
            git reset --hard origin/fix/lexico-optativo-editores-20261114
            npm run offline:build
            git add -- offline.html
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sincronizar la versión autónoma tras mejoras de léxico'
            if git push origin HEAD:fix/lexico-optativo-editores-20261114; then exit 0; fi
          done
          echo 'No se pudo sincronizar offline.html' >&2
          exit 1
