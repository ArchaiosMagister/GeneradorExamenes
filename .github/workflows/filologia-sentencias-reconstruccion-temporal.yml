name: Regenerar corpus filologico sin publicacion
on:
  push:
    branches:
      - fix/auditoria-filologica-latin-griego-20261121
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir paquete offline y ejecutar regresiones
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
          node scripts/test-greek-sentence-philology-20261121.cjs --offline
          node scripts/test-filologia-latin-griego-20261121.cjs --offline
          node scripts/test-greek-lexical-followup-20261121.cjs
          node scripts/test-greek-lexical-filology-20261121.cjs
          node scripts/test-valenciano.cjs
          node scripts/test-lemma-index.mjs
      - name: Guardar solo paquete sincronizado y eliminar flujo temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lemmas/teacher-forms.json offline.html
          git rm ".github/workflows/filologia-sentencias-reconstruccion-temporal.yml"
          git commit -m "build: reconstruir paquete autonomo tras cotejo de griego"
          git push origin "HEAD:fix/auditoria-filologica-latin-griego-20261121"
