name: Reconstruir filología PR205 ronda 4 (sin despliegue)
on:
  push:
    branches: [fix/auditoria-griego-acentos-espiritus-20261121]
    paths: ['.github/workflows/auditoria-filologica-reconstruir-205-ronda4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-griego-acentos-espiritus-20261121
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice académico y HTML autónomo
        run: |
          node scripts/build-lemma-index.mjs
          npm run offline:build
      - name: Verificar correcciones de acento, casos y fuentes
        run: |
          node scripts/test-filologia-latin4-quantity-clusters-20261121.cjs
          node scripts/test-filologia-regimen-acento-20261121.cjs --offline
      - name: Verificar solo artefactos esperados
        run: |
          git diff --name-only >/tmp/files
          if grep -Ev '^(offline\.html|data/lemmas/teacher-forms\.json)$' /tmp/files; then
            echo 'Archivos modificados inesperadamente'; exit 1
          fi
      - name: Guardar artefactos en PR sin publicar
        run: |
          git add -- offline.html data/lemmas/teacher-forms.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: reflejar acentuación griega en versión autónoma'
            git push origin HEAD:fix/auditoria-griego-acentos-espiritus-20261121
          fi
# Reejecución tras actualizar el test de δικαιός/δίκαιός.
