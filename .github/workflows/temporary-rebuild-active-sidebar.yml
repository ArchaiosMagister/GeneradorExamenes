name: Regenerar autónoma y comprobar contraste fuerte (temporal)
on:
  push:
    branches: [fix/active-exam-sidebar-contrast-20261117]
    paths:
      - '.github/workflows/temporary-rebuild-active-sidebar.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML autónomo canónico
        run: npm run offline:build
      - name: Guardar offline.html en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          if ! git diff --cached --quiet; then
            git commit -m "Update standalone HTML for stronger active-section marker"
            git push
          fi
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Verificar navegación y contraste fuerte en web/autónoma
        run: node scripts/test-compact-exam-sidebar.cjs

# Segunda comprobación: insignia integrada sin desbordamiento.
