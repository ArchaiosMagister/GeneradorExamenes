name: Regenerar ignis ablativo singular (temporal)
on:
  push:
    branches:
      - fix/latin-i-stems-hostis-ignis-20261122
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/latin-i-stems-hostis-ignis-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir y retirar workflow temporal
        run: |
          set -euo pipefail
          npm run offline:build
          git diff --quiet -- offline.html && { echo 'Esperábamos actualización del HTML autónomo'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/rebuild-igne-default-once.yml
          git commit -m 'build: sincronizar igne como ablativo singular habitual'
          git push origin HEAD:fix/latin-i-stems-hostis-ignis-20261122
