name: Reconstrucción de PWA para neutros i (sin desplegar)
on:
  push:
    branches:
      - fix/latin-neuter-i-stems-mare-animal-20261122
    paths:
      - '.github/workflows/temporary-render-neuter-i-stems-20261122.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout rama dependiente
        uses: actions/checkout@v4
        with:
          ref: fix/latin-neuter-i-stems-mare-animal-20261122
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir y comprobar HTML autónomo
        run: |
          node scripts/build-offline.mjs
          git diff --check
          node -e 'const s=require("fs").readFileSync("offline.html","utf8");for(const n of ["LATIN_VERIFIED_NEUTER_I_STEMS","animalia","marium"])if(!s.includes(n))process.exit(1)'
      - name: Guardar output y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/temporary-render-neuter-i-stems-20261122.yml
          git commit -m 'build(lat): sincronizar autónoma con mare y animal'
          git push origin HEAD:refs/heads/fix/latin-neuter-i-stems-mare-animal-20261122
