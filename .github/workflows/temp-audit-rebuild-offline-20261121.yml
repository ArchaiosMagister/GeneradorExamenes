name: Temporal · reconstruir offline de auditoría (NO publicar)
on:
  push:
    branches:
      - fix/auditoria-filologica-latin-griego-continuacion-20261121
    paths:
      - vocabulary-generator.js
      - scripts/audit-sentence-lemmas.cjs
      - .github/workflows/temp-audit-rebuild-offline-20261121.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-filologica-latin-griego-continuacion-20261121
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar, reconstruir y retirar este workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-sentence-lemmas.cjs
          npm run offline:build
          node scripts/audit-sentence-lemmas.cjs
          git add -- offline.html
          git rm -- .github/workflows/temp-audit-rebuild-offline-20261121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sincronizar HTML autónomo y retirar workflow temporal de auditoría"
          git push origin HEAD:fix/auditoria-filologica-latin-griego-continuacion-20261121
