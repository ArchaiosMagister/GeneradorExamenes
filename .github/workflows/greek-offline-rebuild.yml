name: Compilar offline temporalmente para auditoría griega
on:
  push:
    branches:
      - audit/greek-academic-coverage-20261120
permissions:
  contents: write
jobs:
  sync-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir offline.html reproducible
        run: |
          npm run offline:build
          npm run offline:test
      - name: Sincronizar offline.html únicamente si ha cambiado
        run: |
          if ! git diff --quiet -- offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline.html
            git commit -m 'build: sincronizar versión autónoma con ampliación griega'
            git push origin HEAD:audit/greek-academic-coverage-20261120
          fi
