name: Sincronizar glosario autónomo (temporal, sin publicar)
on:
  push:
    branches: [feat/latin-passive-phrase-choices-20261115]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML único y verificar su integridad
        run: node scripts/build-offline.mjs && node scripts/test-offline.mjs
      - name: Sincronizar HTML único sin publicar
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sincronizar selector de pasivas en HTML offline"
            git push origin HEAD:feat/latin-passive-phrase-choices-20261115
          fi
