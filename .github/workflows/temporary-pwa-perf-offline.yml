name: Reconstruir HTML autónomo para optimización PWA (temporal, sin publicar)
on:
  push:
    branches: [perf/pwa-startup-cache-pdf-lazy-20261115]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir archivo autónomo
        run: node scripts/build-offline.mjs
      - name: Verificar HTML íntegro, sin red y reproducible
        run: node scripts/test-offline.mjs
      - name: Sincronizar solo offline.html en rama de optimización
        run: |
          git add offline.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: reconstruir HTML autónomo con PDF integrado"
            git push origin HEAD:perf/pwa-startup-cache-pdf-lazy-20261115
          fi
