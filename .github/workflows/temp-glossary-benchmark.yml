name: Medición temporal de lematización latina

on:
  push:
    branches:
      - perf/latin-glossary-bank-reuse-20261115
    paths:
      - '.github/workflows/temp-glossary-benchmark.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar y medir índices sin navegador
        run: |
          node --check scripts/benchmark-latin-glossary.cjs
          node scripts/benchmark-latin-glossary.cjs
