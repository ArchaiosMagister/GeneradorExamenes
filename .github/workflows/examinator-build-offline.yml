name: Regenerar HTML autónomo de Examinator (temporal)

on:
  push:
    branches: ['style/examinator-preview-20261116']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir versión autónoma desde el índice web
        run: npm run offline:build
      - name: Registrar el HTML generado en la rama temporal
        run: |
          git add offline.html
          if git diff --cached --quiet; then
            echo 'HTML autónomo ya actualizado'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerar offline.html a partir del tema Examinator'
          git push origin "HEAD:style/examinator-preview-20261116"
