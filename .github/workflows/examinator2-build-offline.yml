name: Sincronizar HTML offline con el tema de Examinator2 (temporal)
on:
  push:
    branches: ['style/examinator2-menus-20261116']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar versión autónoma desde index.html
        run: npm run offline:build
      - name: Registrar offline.html sincronizado
        run: |
          git add offline.html
          if git diff --cached --quiet; then
            echo 'El HTML autónomo ya coincide'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sincronizar estilos de menús Examinator2 en HTML autónomo'
          git push origin "HEAD:style/examinator2-menus-20261116"
