name: Reconstruir HTML autónomo de auditoría griega (temporal, sin publicar)

on:
  push:
    branches:
      - audit/greek1-lexical-filology-20261121
    paths:
      - .github/workflows/rebuild-greek1-lexical-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir solo la copia autónoma
        run: npm run offline:build
      - name: Validar siete correcciones en web y autónoma
        run: |
          node scripts/test-greek-lexical-filology-20261121.cjs
          node scripts/test-greek-adjective-accent-vocative.cjs
          node scripts/test-greek-pragma-third-decl.cjs
          node scripts/test-greek-third-decl-gender-five.cjs
          node scripts/test-greek-ud8-lexical-accents.cjs
          node scripts/test-revision-559-griego.cjs
      - name: Guardar artefacto generado únicamente en la rama de auditoría
        env:
          AUDIT_BRANCH: audit/greek1-lexical-filology-20261121
        run: |
          if git diff --quiet -- offline.html; then
            echo "El HTML autónomo ya era reproducible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "build(greek1): regenerate offline for lexical corrections"
          git push origin "HEAD:refs/heads/$AUDIT_BRANCH"
