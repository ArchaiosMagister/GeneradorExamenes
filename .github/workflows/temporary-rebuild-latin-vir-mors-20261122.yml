name: Reconstrucción aislada de vir y mors (sin despliegue)
on:
  push:
    branches:
      - fix/latin-paradigm-vir-20261122
    paths:
      - '.github/workflows/temporary-rebuild-latin-vir-mors-20261122.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout de rama de auditoría
        uses: actions/checkout@v4
        with:
          ref: fix/latin-paradigm-vir-20261122
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir offline.html
        run: |
          node scripts/build-offline.mjs
          git diff --check
      - name: Guardar HTML y eliminar flujo temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/temporary-rebuild-latin-vir-mors-20261122.yml
          git commit -m 'build(lat): sincronizar web autónoma con vir y mortium'
          git push origin HEAD:refs/heads/fix/latin-paradigm-vir-20261122
