name: Temporary offline regeneration for compact navigation
on:
  push:
    branches:
      - style/compact-single-line-main-nav-20261117
    paths:
      - index.html
      - .github/workflows/temporary-compact-nav-offline-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical standalone HTML
        run: npm run offline:build
      - name: Commit standalone file
        run: |
          set -euo pipefail
          if git diff --quiet -- offline.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "build: synchronize standalone HTML for instant theme switching"
          git push origin HEAD:style/compact-single-line-main-nav-20261117
