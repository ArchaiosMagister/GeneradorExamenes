name: Temporary sidebar tabs offline sync
on:
  push:
    branches:
      - ui/sidebar-section-tabs-20261117
    paths:
      - .github/workflows/temporary-sidebar-tabs-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone HTML from the source files
        run: npm run offline:build
      - name: Save generated standalone HTML
        run: |
          set -euo pipefail
          if git diff --quiet -- offline.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "build: sync standalone HTML with sidebar section tabs"
          git push origin HEAD:ui/sidebar-section-tabs-20261117
