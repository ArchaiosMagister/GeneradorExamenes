name: Reconstruir PWA para auditoría griega (temporal, sin publicación)
on:
  push:
    branches:
      - audit/greek1-oligos-polys-20261121
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir índice académico desde origen inmutable y la corrección editorial
        run: node scripts/build-lemma-index.mjs
      - name: Reconstruir la PWA desde las fuentes de la rama aislada
        run: npm run offline:build
      - name: Probar acentos, vocativos y migración en ambos HTML
        run: node scripts/test-greek-adjective-accent-vocative.cjs
      - name: Guardar exclusivamente índice y HTML reconstruidos
        run: |
          if ! git diff --quiet -- data/lemmas/teacher-forms.json offline.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/lemmas/teacher-forms.json offline.html
            git commit -m 'build: sincronizar offline griego tras auditoría UD5'
            git push
          fi
