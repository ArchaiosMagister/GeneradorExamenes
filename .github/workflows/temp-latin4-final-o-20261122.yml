name: TEMP reconstruir LAT4 cantidad final sin desplegar
on:
  push:
    branches:
      - fix/latin4-o-final-cantidad-20261122
    paths:
      - 'index.html'
      - 'required-latin-units.js'
      - 'data/lemmas/teacher-forms.json'
      - '.github/workflows/temp-latin4-final-o-20261122.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir desde fuentes
        run: npm run offline:build
      - name: Verificar siete cantidades y archivo autónomo
        run: node scripts/test-filologia-latin4-final-o-20261122.cjs --offline
      - name: Conservar PWA y retirar CI temporal
        run: |
          rm .github/workflows/temp-latin4-final-o-20261122.yml
          git add offline.html .github/workflows/temp-latin4-final-o-20261122.yml
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(lat4): reconstruir PWA tras cotejo de cantidades finales"
            git push
          fi
