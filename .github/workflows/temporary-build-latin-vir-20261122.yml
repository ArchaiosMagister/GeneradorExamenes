name: Reproducir HTML autónomo para paradigma vir (sin desplegar)
on:
  push:
    branches:
      - fix/latin-paradigm-vir-20261122
    paths:
      - '.github/workflows/temporary-build-latin-vir-20261122.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recuperar rama
        uses: actions/checkout@v4
        with:
          ref: fix/latin-paradigm-vir-20261122
          fetch-depth: 1
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar HTML autónomo
        run: |
          node scripts/build-offline.mjs
          git diff --check
          node -e "const fs=require('fs');const x=fs.readFileSync('offline.html','utf8'); if(!x.includes('vir: \'bonus doctus strenuus\'')) process.exit(1)"
      - name: Conservar resultado y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline.html
          git rm .github/workflows/temporary-build-latin-vir-20261122.yml
          git commit -m 'build(lat): sincronizar autónoma con vir, viri'
          git push origin HEAD:refs/heads/fix/latin-paradigm-vir-20261122
