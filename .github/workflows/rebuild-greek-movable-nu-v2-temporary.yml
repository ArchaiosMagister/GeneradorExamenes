name: Reconstrucción temporal de ν móvil griego 2 (sin publicar)
on:
  push:
    branches:
      - audit/greek-movable-nu-20261121
    paths:
      - scripts/test-greek-movable-nu.cjs

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar la PWA desde fuentes griegas de la rama
        run: |
          node --check scripts/test-greek-movable-nu.cjs
          node --check scripts/test-greek-movable-nu-browser.cjs
          npm run offline:build
      - name: Verificar ν nominal y verbal, sincretismo, exámenes y PWA
        run: |
          node scripts/test-greek-movable-nu.cjs
          node scripts/test-greek-verb-syncretism.cjs
          node scripts/test-exam-models.cjs
          npm run offline:test
      - name: Guardar solo offline.html tras comprobación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git diff --cached --stat
          git diff --cached --quiet && { echo 'PWA no reconstruida'; exit 1; }
          git commit -m "build: reflejar ν móvil nominal y verbal en HTML autónomo"
          git push origin HEAD:audit/greek-movable-nu-20261121
