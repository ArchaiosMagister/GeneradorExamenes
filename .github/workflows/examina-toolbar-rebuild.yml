name: Regenerar HTML autónomo de botones uniformes (temporal)
on:
  push:
    branches: ['fix/equal-toolbar-buttons-20261116']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir HTML autónomo
        run: npm run offline:build
      - name: Sincronizar offline.html
        run: |
          git add offline.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerar HTML autónomo con botones uniformes'
          git push origin "HEAD:fix/equal-toolbar-buttons-20261116"
