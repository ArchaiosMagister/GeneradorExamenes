name: Incorporar lote filológico 100 (solo revisión)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/promote-candidates-100.cjs'
      - '.github/workflows/promote-candidates-100.yml'

permissions:
  contents: write

jobs:
  promover-en-rama-de-revision:
    if: github.head_ref == 'revision-filologica-integral-20261113' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incorporar las cien decisiones contrastadas sin alterar el currículo
        run: node scripts/promote-candidates-100.cjs
      - name: Regenerar paquete autónomo
        run: npm run offline:build
      - name: Contrastar las cien casillas en banco e índice
        run: node scripts/test-candidaturas-lote100.cjs
      - name: Comprobar lematizador y fuente individual
        run: node scripts/test-lemma-index.mjs && node scripts/test-verified-verb-overrides.cjs
      - name: Comprobar evidencias verbales y currículo
        run: node scripts/test-latin-verb-evidence.cjs
      - name: Comprobar versión autónoma y banco
        run: node scripts/test-phase-two-persistent-offline.cjs && node scripts/test-offline.mjs
      - name: Comprobar el inventario pendiente
        run: node scripts/test-comprehensive-morph-audit.cjs
      - name: Guardar todos los cambios solo si todas las pruebas pasan
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lemmas/teacher-forms.json data/lemmas/verified-overrides.json \
            data/lemmas/revision-candidaturas-lote100-20261113.json \
            index.html offline.html scripts/build-lemma-index.mjs \
            scripts/test-candidaturas-lote100.cjs scripts/test-comprehensive-morph-audit.cjs \
            scripts/test-latin-verb-evidence.cjs docs/revision-filologica-integral-20261113.md
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "feat(filologia): trasladar cien formas a fuente 5 y sincronizar offline"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
